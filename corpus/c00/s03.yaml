# Prélude, scène P.3 — Le battement de la phrase (4.3). Paires d'écoute : chaque mot est une expression à un énoncé ; son partenaire de paire est son renvoi.
id: c00.s03
titre: Le battement de la phrase
intention: >-
  À la fin de cette scène, vous entendez où tombe la syllabe forte d’un mot, vous
  savez qu’elle change parfois le mot lui-même, et vous reconnaissez le son ə, la
  voyelle effacée qui donne à l’anglais son rythme.
version: 1
moments:
  - lettre: A
    titre: Le nom et le verbe
    expressions:
      - id: c00.s03.A1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A1.e1
            region: commun
            texte: { uk: "a record", us: "a record" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the noun, stress on the FIRST syllable, REC-ord.", emotion: "clear, friendly" }
        sens: un disque ; un record
        usage: >-
          Le nom porte la force sur la première syllabe : <en>REcord</en>. La seconde s’efface
          en ə. Le verbe fait l’inverse.
        declinaisons:
          - { id: c00.s03.A1.d1, texte: { uk: "It's a world record.", us: "It's a world record." }, sens: "C’est un record du monde." }
          - { id: c00.s03.A1.d2, texte: { uk: "I'll keep a record of it.", us: "I'll keep a record of it." }, sens: "J’en garderai une trace." }
          - { id: c00.s03.A1.d3, texte: { uk: "Put a record on.", us: "Put a record on." }, sens: "Mets un disque." }
          - { id: c00.s03.A1.d4, texte: { uk: "She's got a clean record.", us: "She has a clean record." }, sens: "Elle a un casier vierge." }
          - { id: c00.s03.A1.d5, texte: { uk: "For the record, I said no.", us: "For the record, I said no." }, sens: "Pour mémoire, j’ai dit non." }
        renvois: [c00.s03.A2]
      - id: c00.s03.A2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A2.e1
            region: commun
            texte: { uk: "to record", us: "to record" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the verb, stress on the SECOND syllable, re-CORD.", emotion: "clear, friendly" }
        sens: enregistrer
        usage: >-
          Le verbe porte la force sur la seconde syllabe : <en>reCORD</en>. La première se
          réduit en ri ou rə.
        declinaisons:
          - { id: c00.s03.A2.d1, texte: { uk: "Can I record this?", us: "Can I record this?" }, sens: "Je peux enregistrer ça ?" }
          - { id: c00.s03.A2.d2, texte: { uk: "We're recording now.", us: "We're recording now." }, sens: "On enregistre, là." }
          - { id: c00.s03.A2.d3, texte: { uk: "Record it for me.", us: "Record it for me." }, sens: "Enregistre-le pour moi." }
          - { id: c00.s03.A2.d4, texte: { uk: "The call may be recorded.", us: "The call may be recorded." }, sens: "L’appel peut être enregistré." }
          - { id: c00.s03.A2.d5, texte: { uk: "She recorded a new song.", us: "She recorded a new song." }, sens: "Elle a enregistré une nouvelle chanson." }
        renvois: [c00.s03.A1]
      - id: c00.s03.A3
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A3.e1
            region: commun
            texte: { uk: "a present", us: "a present" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the noun, stress on the FIRST syllable, PRES-ent.", emotion: "clear, friendly" }
        sens: un cadeau
        usage: >-
          Le nom : <en>PREsent</en>, la force au début. Le verbe, <en>preSENT</en>, signifie «
          présenter ».
        declinaisons:
          - { id: c00.s03.A3.d1, texte: { uk: "It's a present for you.", us: "It's a present for you." }, sens: "C’est un cadeau pour toi." }
          - { id: c00.s03.A3.d2, texte: { uk: "I need to buy a present.", us: "I need to buy a present." }, sens: "Il faut que j’achète un cadeau." }
          - { id: c00.s03.A3.d3, texte: { uk: "Thanks for the present!", us: "Thanks for the present!" }, sens: "Merci pour le cadeau !" }
          - { id: c00.s03.A3.d4, texte: { uk: "Don't open your present yet.", us: "Don't open your present yet." }, sens: "N’ouvre pas encore ton cadeau." }
          - { id: c00.s03.A3.d5, texte: { uk: "What a lovely present.", us: "What a nice present." }, sens: "Quel joli cadeau." }
        renvois: [c00.s03.A4]
      - id: c00.s03.A4
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A4.e1
            region: commun
            texte: { uk: "to present", us: "to present" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the verb, stress on the SECOND syllable, pre-SENT.", emotion: "clear, friendly" }
        sens: présenter
        usage: >-
          Le verbe : la force passe sur la seconde syllabe, la première se réduit en pri.
        declinaisons:
          - { id: c00.s03.A4.d1, texte: { uk: "I'll present the results.", us: "I'll present the results." }, sens: "Je présenterai les résultats." }
          - { id: c00.s03.A4.d2, texte: { uk: "She presents the news.", us: "She anchors the news." }, sens: "Elle présente le journal." }
          - { id: c00.s03.A4.d3, texte: { uk: "Let me present my team.", us: "Let me present my team." }, sens: "Permettez-moi de vous présenter mon équipe." }
          - { id: c00.s03.A4.d4, texte: { uk: "He presented it well.", us: "He presented it well." }, sens: "Il l’a bien présenté." }
          - { id: c00.s03.A4.d5, texte: { uk: "Who's presenting today?", us: "Who's presenting today?" }, sens: "Qui présente aujourd’hui ?" }
        renvois: [c00.s03.A3]
      - id: c00.s03.A5
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A5.e1
            region: commun
            texte: { uk: "an increase", us: "an increase" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the noun, stress on the FIRST syllable, IN-crease.", emotion: "clear, friendly" }
        sens: une hausse
        usage: >-
          Le nom : <en>INcrease</en>. On l’entend dans les nouvelles et au travail, à côté de
          <en>a pay rise</en>, l’augmentation de salaire.
        declinaisons:
          - { id: c00.s03.A5.d1, texte: { uk: "There's been an increase in prices.", us: "There's been an increase in prices." }, sens: "Les prix ont augmenté." }
          - { id: c00.s03.A5.d2, texte: { uk: "A big increase.", us: "A big increase." }, sens: "Une forte hausse." }
          - { id: c00.s03.A5.d3, texte: { uk: "I asked for an increase.", us: "I asked for an increase." }, sens: "J’ai demandé une augmentation." }
          - { id: c00.s03.A5.d4, texte: { uk: "Prices are on the increase.", us: "Prices are on the increase." }, sens: "Les prix sont en hausse." }
          - { id: c00.s03.A5.d5, texte: { uk: "A ten per cent increase.", us: "A ten percent increase." }, sens: "Une hausse de dix pour cent." }
        renvois: [c00.s03.A6]
      - id: c00.s03.A6
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A6.e1
            region: commun
            texte: { uk: "to increase", us: "to increase" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the verb, stress on the SECOND syllable, in-CREASE.", emotion: "clear, friendly" }
        sens: augmenter
        usage: >-
          Le verbe : <en>inCREASE</en>. Les mots identiques à l’écrit changent souvent de
          syllabe forte entre nom et verbe.
        declinaisons:
          - { id: c00.s03.A6.d1, texte: { uk: "Prices keep increasing.", us: "Prices keep increasing." }, sens: "Les prix n’arrêtent pas d’augmenter." }
          - { id: c00.s03.A6.d2, texte: { uk: "We need to increase sales.", us: "We need to increase sales." }, sens: "Il faut augmenter les ventes." }
          - { id: c00.s03.A6.d3, texte: { uk: "It increases the risk.", us: "It increases the risk." }, sens: "Ça augmente le risque." }
          - { id: c00.s03.A6.d4, texte: { uk: "The rent's increased again.", us: "The rent's increased again." }, sens: "Le loyer a encore augmenté." }
          - { id: c00.s03.A6.d5, texte: { uk: "Increase the heat a little.", us: "Increase the heat a little." }, sens: "Monte un peu le feu." }
        renvois: [c00.s03.A5]
      - id: c00.s03.A7
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A7.e1
            region: commun
            texte: { uk: "an insult", us: "an insult" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the noun, stress on the FIRST syllable, IN-sult.", emotion: "clear, friendly" }
        sens: une insulte
        usage: >-
          Le nom : <en>INsult</en>. Le verbe, <en>inSULT</en>, déplace la force.
        declinaisons:
          - { id: c00.s03.A7.d1, texte: { uk: "That's an insult.", us: "That's an insult." }, sens: "C’est une insulte." }
          - { id: c00.s03.A7.d2, texte: { uk: "Is that a compliment or an insult?", us: "Is that a compliment or an insult?" }, sens: "C’est un compliment ou une insulte ?" }
          - { id: c00.s03.A7.d3, texte: { uk: "He shouted insults.", us: "He shouted insults." }, sens: "Il criait des insultes." }
          - { id: c00.s03.A7.d4, texte: { uk: "No insult intended.", us: "No insult intended." }, sens: "Sans vouloir te vexer." }
          - { id: c00.s03.A7.d5, texte: { uk: "It's an insult to my cooking.", us: "It's an insult to my cooking." }, sens: "C’est une insulte à ma cuisine." }
        renvois: [c00.s03.A8]
      - id: c00.s03.A8
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.A8.e1
            region: commun
            texte: { uk: "to insult", us: "to insult" }
            jeu: { contexte: "Saying a short phrase clearly so a learner can hear the stress: the verb, stress on the SECOND syllable, in-SULT.", emotion: "clear, friendly" }
        sens: insulter
        usage: >-
          Le verbe : <en>inSULT</en>. Dites les deux à la suite, en tapant sur la table à
          chaque syllabe forte.
        declinaisons:
          - { id: c00.s03.A8.d1, texte: { uk: "Don't insult me.", us: "Don't insult me." }, sens: "Ne m’insulte pas." }
          - { id: c00.s03.A8.d2, texte: { uk: "I didn't mean to insult you.", us: "I didn't mean to insult you." }, sens: "Je ne voulais pas te vexer." }
          - { id: c00.s03.A8.d3, texte: { uk: "Are you insulting my car?", us: "Are you insulting my car?" }, sens: "Tu insultes ma voiture ?" }
          - { id: c00.s03.A8.d4, texte: { uk: "He insulted the referee.", us: "He insulted the referee." }, sens: "Il a insulté l’arbitre." }
          - { id: c00.s03.A8.d5, texte: { uk: "I feel insulted.", us: "I feel insulted." }, sens: "Je me sens insulté." }
        renvois: [c00.s03.A7]
  - lettre: B
    titre: La syllabe forte qui se déplace
    expressions:
      - id: c00.s03.B1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B1.e1
            region: commun
            texte: { uk: "desert", us: "desert" }
            jeu: { contexte: "Saying a single word clearly: stress on the FIRST syllable, DEZ-ert.", emotion: "clear, friendly" }
        sens: désert
        usage: >-
          Le désert : <en>DEsert</en>, force au début, la fin réduite en ə. Le dessert se dit
          <en>deSSERT</en>, force à la fin : l’orthographe ne vous le dit pas, l’oreille si.
        declinaisons:
          - { id: c00.s03.B1.d1, texte: { uk: "We drove across the desert.", us: "We drove across the desert." }, sens: "On a traversé le désert en voiture." }
          - { id: c00.s03.B1.d2, texte: { uk: "It's like a desert in here.", us: "It's like a desert in here." }, sens: "C’est un vrai désert, ici." }
          - { id: c00.s03.B1.d3, texte: { uk: "The Sahara Desert.", us: "The Sahara Desert." }, sens: "Le désert du Sahara." }
          - { id: c00.s03.B1.d4, texte: { uk: "It's hot as a desert.", us: "It's hot as a desert." }, sens: "Il fait une chaleur de désert." }
          - { id: c00.s03.B1.d5, texte: { uk: "A desert island.", us: "A desert island." }, sens: "Une île déserte." }
        renvois: [c00.s03.B2]
      - id: c00.s03.B2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B2.e1
            region: commun
            texte: { uk: "dessert", us: "dessert" }
            jeu: { contexte: "Saying a single word clearly: stress on the SECOND syllable, di-ZURT.", emotion: "clear, friendly" }
        sens: dessert
        usage: >-
          Force sur la seconde syllabe, la première réduite en di ou də. Un moyen de s’en
          souvenir : on veut toujours deux fois plus de dessert, d’où les deux s.
        declinaisons:
          - { id: c00.s03.B2.d1, texte: { uk: "What's for dessert?", us: "What's for dessert?" }, sens: "Qu’est-ce qu’il y a comme dessert ?" }
          - { id: c00.s03.B2.d2, texte: { uk: "I'll skip dessert.", us: "I'll skip dessert." }, sens: "Je vais me passer de dessert." }
          - { id: c00.s03.B2.d3, texte: { uk: "Dessert's on me.", us: "Dessert's on me." }, sens: "Le dessert, c’est moi qui l’offre." }
          - { id: c00.s03.B2.d4, texte: { uk: "Is there room for dessert?", us: "Is there room for dessert?" }, sens: "Il reste de la place pour le dessert ?" }
          - { id: c00.s03.B2.d5, texte: { uk: "Can we see the dessert menu?", us: "Can we see the dessert menu?" }, sens: "On peut voir la carte des desserts ?" }
        renvois: [c00.s03.B1]
      - id: c00.s03.B3
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B3.e1
            region: commun
            texte: { uk: "photograph", us: "photograph" }
            jeu: { contexte: "Saying a single word clearly: stress on the FIRST syllable, PHO-to-graph.", emotion: "clear, friendly" }
        sens: photographie
        usage: >-
          La force sur la première syllabe : <en>PHOtograph</en>. Ajoutez -er, et elle saute
          sur la deuxième : <en>phoTOgrapher</en>.
        declinaisons:
          - { id: c00.s03.B3.d1, texte: { uk: "Can I take a photograph?", us: "Can I take a photograph?" }, sens: "Je peux prendre une photo ?" }
          - { id: c00.s03.B3.d2, texte: { uk: "It's an old photograph.", us: "It's an old photograph." }, sens: "C’est une vieille photo." }
          - { id: c00.s03.B3.d3, texte: { uk: "No photographs, please.", us: "No photographs, please." }, sens: "Pas de photos, s’il vous plaît." }
          - { id: c00.s03.B3.d4, texte: { uk: "She photographs weddings.", us: "She photographs weddings." }, sens: "Elle photographie des mariages." }
          - { id: c00.s03.B3.d5, texte: { uk: "I don't photograph well.", us: "I don't photograph well." }, sens: "Je ne suis pas photogénique." }
        renvois: [c00.s03.B4]
      - id: c00.s03.B4
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B4.e1
            region: commun
            texte: { uk: "photographer", us: "photographer" }
            jeu: { contexte: "Saying a single word clearly: stress on the SECOND syllable, pho-TOG-ra-pher.", emotion: "clear, friendly" }
        sens: photographe
        usage: >-
          Le suffixe déplace la force : <en>phoTOgrapher</en>. La première syllabe s’efface en
          fə.
        declinaisons:
          - { id: c00.s03.B4.d1, texte: { uk: "She's a photographer.", us: "She's a photographer." }, sens: "Elle est photographe." }
          - { id: c00.s03.B4.d2, texte: { uk: "We hired a photographer.", us: "We hired a photographer." }, sens: "On a engagé un photographe." }
          - { id: c00.s03.B4.d3, texte: { uk: "The photographer's here.", us: "The photographer's here." }, sens: "Le photographe est là." }
          - { id: c00.s03.B4.d4, texte: { uk: "Ask the photographer.", us: "Ask the photographer." }, sens: "Demande au photographe." }
          - { id: c00.s03.B4.d5, texte: { uk: "He's a wedding photographer.", us: "He's a wedding photographer." }, sens: "Il est photographe de mariage." }
        renvois: [c00.s03.B3]
      - id: c00.s03.B5
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B5.e1
            region: commun
            texte: { uk: "Japan", us: "Japan" }
            jeu: { contexte: "Saying a single word clearly: stress on the SECOND syllable, ja-PAN.", emotion: "clear, friendly" }
        sens: le Japon
        usage: >-
          <en>JaPAN</en> : force à la fin, première syllabe en ə. Pour l’adjectif
          <en>JapaNESE</en>, la force recule encore.
        declinaisons:
          - { id: c00.s03.B5.d1, texte: { uk: "I've been to Japan.", us: "I've been to Japan." }, sens: "Je suis allé au Japon." }
          - { id: c00.s03.B5.d2, texte: { uk: "She lives in Japan.", us: "She lives in Japan." }, sens: "Elle vit au Japon." }
          - { id: c00.s03.B5.d3, texte: { uk: "We're flying to Japan.", us: "We're flying to Japan." }, sens: "On part au Japon en avion." }
          - { id: c00.s03.B5.d4, texte: { uk: "Japan's beautiful in spring.", us: "Japan's beautiful in spring." }, sens: "Le Japon est magnifique au printemps." }
          - { id: c00.s03.B5.d5, texte: { uk: "It's made in Japan.", us: "It's made in Japan." }, sens: "C’est fabriqué au Japon." }
        renvois: [c00.s03.B6]
      - id: c00.s03.B6
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B6.e1
            region: commun
            texte: { uk: "Japanese", us: "Japanese" }
            jeu: { contexte: "Saying a single word clearly: stress on the LAST syllable, ja-pa-NESE.", emotion: "clear, friendly" }
        sens: japonais
        usage: >-
          Les mots en -ese portent la force sur la fin : <en>JapaNESE</en>, <en>ChiNESE</en>.
          Avant un nom, elle peut reculer : <en>a JApanese car</en>.
        declinaisons:
          - { id: c00.s03.B6.d1, texte: { uk: "Do you speak Japanese?", us: "Do you speak Japanese?" }, sens: "Tu parles japonais ?" }
          - { id: c00.s03.B6.d2, texte: { uk: "I love Japanese food.", us: "I love Japanese food." }, sens: "J’adore la cuisine japonaise." }
          - { id: c00.s03.B6.d3, texte: { uk: "She's Japanese.", us: "She's Japanese." }, sens: "Elle est japonaise." }
          - { id: c00.s03.B6.d4, texte: { uk: "Let's get Japanese tonight.", us: "Let's get Japanese tonight." }, sens: "On mange japonais ce soir." }
          - { id: c00.s03.B6.d5, texte: { uk: "The menu's in Japanese.", us: "The menu's in Japanese." }, sens: "La carte est en japonais." }
        renvois: [c00.s03.B5]
      - id: c00.s03.B7
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B7.e1
            region: commun
            texte: { uk: "economy", us: "economy" }
            jeu: { contexte: "Saying a single word clearly: stress on the SECOND syllable, e-CON-o-my.", emotion: "clear, friendly" }
        sens: économie
        usage: >-
          <en>eCOnomy</en> : force sur la deuxième syllabe. L’adjectif <en>ecoNOmic</en> la
          déplace d’un cran.
        declinaisons:
          - { id: c00.s03.B7.d1, texte: { uk: "The economy's doing well.", us: "The economy's doing well." }, sens: "L’économie se porte bien." }
          - { id: c00.s03.B7.d2, texte: { uk: "We flew economy.", us: "We flew economy." }, sens: "On a voyagé en classe économique." }
          - { id: c00.s03.B7.d3, texte: { uk: "It's good for the economy.", us: "It's good for the economy." }, sens: "C’est bon pour l’économie." }
          - { id: c00.s03.B7.d4, texte: { uk: "The local economy.", us: "The local economy." }, sens: "L’économie locale." }
          - { id: c00.s03.B7.d5, texte: { uk: "An economy car park.", us: "An economy parking lot." }, sens: "Un parking économique." }
        renvois: [c00.s03.B8]
      - id: c00.s03.B8
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, rythme]
        fonctions: [ecouter]
        enonces:
          - id: c00.s03.B8.e1
            region: commun
            texte: { uk: "economic", us: "economic" }
            jeu: { contexte: "Saying a single word clearly: stress on the THIRD syllable, e-co-NOM-ic.", emotion: "clear, friendly" }
