essentiel:
  incontournables: [c00.s03.A1, c00.s03.A2, c00.s03.A3, c00.s03.A4, c00.s03.B1, c00.s03.B2, c00.s03.C1, c00.s03.C2, c00.s03.C3, c00.s03.C4]
  fauxPas:
    - fautif: "What's for desert?"
      naturel: "What's for dessert?"
      pourquoi: "À table, on attend le <en>deSSERT</en>, force à la fin. Le <en>DEsert</en>, force au début, c’est le Sahara."
    - fautif: "Pho-to-GRAPH."
      naturel: "PHOtograph."
      pourquoi: "L’anglais ne frappe pas la dernière syllabe comme le français : <en>PHOtograph</en>, <en>phoTOgrapher</en>."
    - fautif: "I want to re-cord a re-cord."
      naturel: "I want to reCORD a REcord."
      pourquoi: "Le verbe et le nom ne se disent pas de la même façon : la force change de place."
    - fautif: "Call the plice!"
      naturel: "Call the police!"
      pourquoi: "Le ə de <en>police</en> est léger, mais il est là : sans lui, le mot se rapproche de <en>please</en>."
    - fautif: "ECO-NO-MIC."
      naturel: "ecoNOmic."
      pourquoi: "Une seule syllabe forte par mot, les autres s’effacent : c’est le battement de l’anglais."
sceneVivante:
  titre: Le cadeau
  repliques:
    - { id: c00.s03.sv.l01, personnage: mia, texte: { uk: "Daddy, is that a present for me?", us: "Daddy, is that a present for me?" }, sens: "Papa, c’est un cadeau pour moi ?", emotion: "excited, spotting a box" }
    - { id: c00.s03.sv.l02, personnage: kofi, texte: { uk: "It might be. After dessert.", us: "It might be. After dessert." }, sens: "Peut-être. Après le dessert.", emotion: "teasing, mysterious" }
    - { id: c00.s03.sv.l03, personnage: mia, texte: { uk: "What's for dessert?", us: "What's for dessert?" }, sens: "Qu’est-ce qu’il y a comme dessert ?", emotion: "eager" }
    - { id: c00.s03.sv.l04, personnage: sarah, texte: { uk: "Chocolate cake. And then you can open your present.", us: "Chocolate cake. And then you can open your present." }, sens: "Un gâteau au chocolat. Ensuite, tu pourras ouvrir ton cadeau.", emotion: "warm, smiling" }
    - { id: c00.s03.sv.l05, personnage: mia, texte: { uk: "Can I record it on your phone?", us: "Can I record it on your phone?" }, sens: "Je peux l’enregistrer sur ton téléphone ?", emotion: "pleading" }
    - { id: c00.s03.sv.l06, personnage: kofi, texte: { uk: "Record what? You eating cake?", us: "Record what? You eating cake?" }, sens: "Enregistrer quoi ? Toi en train de manger du gâteau ?", emotion: "amused" }
    - { id: c00.s03.sv.l07, personnage: mia, texte: { uk: "No! Me opening the present!", us: "No! Me opening the present!" }, sens: "Mais non ! Moi en train d’ouvrir le cadeau !", emotion: "indignant, giggling" }
    - { id: c00.s03.sv.l08, personnage: sarah, texte: { uk: "Fine. I'll be the photographer.", us: "Fine. I'll be the photographer." }, sens: "D’accord. Je serai la photographe.", emotion: "playful" }
    - { id: c00.s03.sv.l09, personnage: mia, texte: { uk: "It's a camera! A real one!", us: "It's a camera! A real one!" }, sens: "C’est un appareil photo ! Un vrai !", emotion: "thrilled, tearing the paper" }
    - { id: c00.s03.sv.l10, personnage: kofi, texte: { uk: "Now you're the photographer.", us: "Now you're the photographer." }, sens: "Maintenant, c’est toi la photographe.", emotion: "proud, gentle" }
rituel:
