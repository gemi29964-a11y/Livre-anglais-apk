  fauxPas:
    - fautif: "I sink so."
      naturel: "I think so."
      pourquoi: "Sans la langue entre les dents, <en>think</en> devient <en>sink</en>, « couler ». Laissez l’air passer sur le bout de la langue."
    - fautif: "Free coffees, please."
      naturel: "Three coffees, please."
      pourquoi: "Le th de <en>three</en> se fait avec la langue, pas avec la lèvre : sinon vous commandez des cafés « gratuits »."
    - fautif: "I like your at."
      naturel: "I like your hat."
      pourquoi: "Le h anglais se souffle. Sans lui, <en>hat</en> devient <en>at</en> et la phrase perd son sens."
    - fautif: "Turn light here."
      naturel: "Turn right here."
      pourquoi: "Le r anglais ne touche pas le palais. Langue collée, on entend <en>light</en>."
    - fautif: "Dey're here."
      naturel: "They're here."
      pourquoi: "Le th de <en>they</en> glisse entre les dents en vibrant ; un d frappé fait entendre un autre mot."
