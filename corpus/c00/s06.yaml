        sens: attrapé
        usage: >-
          <en>Caught</en> : kɔːt à Londres, voyelle longue et ronde ; à Chicago, kɑt ou kɔt
          (P.2). Jamais la diphtongue de <en>coat</en>.
        declinaisons:
          - { id: c00.s06.C2.d1, texte: { uk: "I caught the bus.", us: "I caught the bus." }, sens: "J’ai attrapé le bus." }
          - { id: c00.s06.C2.d2, texte: { uk: "He caught a cold.", us: "He caught a cold." }, sens: "Il a attrapé un rhume." }
          - { id: c00.s06.C2.d3, texte: { uk: "We got caught in the rain.", us: "We got caught in the rain." }, sens: "On s’est fait surprendre par la pluie." }
