essentiel:
  incontournables: [c00.s06.A1, c00.s06.A2, c00.s06.A3, c00.s06.A4, c00.s06.B1, c00.s06.B2, c00.s06.B3, c00.s06.B4, c00.s06.C1, c00.s06.C2]
  fauxPas:
    - fautif: "Mélanger les deux accents dans une même phrase"
      naturel: "Choisir un accent et le tenir"
      pourquoi: "Les deux sont corrects ; mélangés, ils brouillent l’oreille de l’autre. Le livre propose les deux versions pour que vous en choisissiez une."
    - fautif: "hot (prononcé comme le français « hotte »)"
      naturel: "hot"
      pourquoi: "Le o anglais est bref et arrondi (Londres) ou ouvert comme dans « pâte » (Chicago), jamais fermé."
    - fautif: "go (prononcé comme le français « go »)"
      naturel: "go"
      pourquoi: "Le o de <en>go</en> glisse toujours vers un ou : gəʊ ou goʊ. Un o tenu sonne étranger des deux côtés."
    - fautif: "Prononcer le r de father à Londres"
      naturel: "father"
      pourquoi: "Dans l’accent londonien, le r final ne se dit que devant une voyelle. À Chicago, il se dit toujours."
    - fautif: "can't (avec le a de « chat »)"
      naturel: "can't"
      pourquoi: "<en>Can’t</en> : kɑːnt à Londres, kænt à New York. Les deux voyelles sont longues et pleines, c’est ce qui l’oppose à <en>can</en>."
