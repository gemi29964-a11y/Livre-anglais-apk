          - { id: c00.s06.C8.d3, texte: { uk: "Who saw it?", us: "Who saw it?" }, sens: "Qui l’a vu ?" }
          - { id: c00.s06.C8.d4, texte: { uk: "I never saw him again.", us: "I never saw him again." }, sens: "Je ne l’ai jamais revu." }
          - { id: c00.s06.C8.d5, texte: { uk: "We saw a film.", us: "We saw a movie." }, sens: "On a vu un film." }
