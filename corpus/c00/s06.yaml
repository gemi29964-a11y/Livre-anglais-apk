        sens: donc ; tellement
        usage: >-
          <en>So</en> : səʊ à Londres, soʊ à Chicago. <en>Saw</en> : sɔː contre sɑ ou sɔ. Le
          mot le plus fréquent de la conversation, sous deux formes.
        declinaisons:
          - { id: c00.s06.C7.d1, texte: { uk: "So, what now?", us: "So, what now?" }, sens: "Bon, et maintenant ?" }
          - { id: c00.s06.C7.d2, texte: { uk: "I'm so tired.", us: "I'm so tired." }, sens: "Je suis tellement fatigué." }
          - { id: c00.s06.C7.d3, texte: { uk: "I think so.", us: "I think so." }, sens: "Je crois." }
          - { id: c00.s06.C7.d4, texte: { uk: "So do I.", us: "So do I." }, sens: "Moi aussi." }
