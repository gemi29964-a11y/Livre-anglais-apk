          - { id: c00.s06.C1.d3, texte: { uk: "Take your coat off.", us: "Take your coat off." }, sens: "Enlève ton manteau." }
          - { id: c00.s06.C1.d4, texte: { uk: "Where's my coat?", us: "Where's my coat?" }, sens: "Où est mon manteau ?" }
