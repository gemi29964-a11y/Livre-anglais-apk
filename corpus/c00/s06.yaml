          - { id: c00.s06.B2.d3, texte: { uk: "I know it by heart.", us: "I know it by heart." }, sens: "Je le connais par cœur." }
          - { id: c00.s06.B2.d4, texte: { uk: "heart attack", us: "heart attack" }, sens: "une crise cardiaque" }
          - { id: c00.s06.B2.d5, texte: { uk: "She has a big heart.", us: "She has a big heart." }, sens: "Elle a bon cœur." }
        renvois: [c00.s06.B1]
