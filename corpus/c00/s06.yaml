# Prélude, scène P.6 — Deux Anglais, une langue (4.3). Paires d'écoute : chaque mot est une expression à un énoncé ; son partenaire de paire est son renvoi. Les versions UK et US de chaque énoncé constituent l'écoute comparée.
id: c00.s06
titre: Deux Anglais, une langue
intention: >-
  À la fin de cette scène, vous reconnaissez un accent britannique et un accent
  américain en trois indices : le r final, le o de <en>hot</en> et le o de
  <en>go</en>. Vous savez aussi que <en>can’t</en> et <en>tomato</en> changent de
  voyelle, et que les deux accents se comprennent parfaitement.
version: 1
moments:
  - lettre: A
    titre: Le r final
    expressions:
      - id: c00.s06.A1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, deux-accents]
        fonctions: [ecouter]
        enonces:
          - id: c00.s06.A1.e1
            region: commun
            texte: { uk: "father", us: "father" }
            jeu: { contexte: "Saying the word clearly and naturally in your own accent: 'father'.", emotion: "clear, friendly" }
        sens: père
        usage: >-
          À Londres, le r final ne se prononce pas : <en>father</en> et <en>farther</en>
          sonnent pareil, fɑːðə. À Chicago, le r s’entend : fɑːðɚ contre fɑːrðɚ. Même langue,
          deux façons d’écouter.
        declinaisons:
          - { id: c00.s06.A1.d1, texte: { uk: "My father's a teacher.", us: "My father's a teacher." }, sens: "Mon père est professeur." }
          - { id: c00.s06.A1.d2, texte: { uk: "like father, like son", us: "like father, like son" }, sens: "tel père, tel fils" }
          - { id: c00.s06.A1.d3, texte: { uk: "Father's Day", us: "Father's Day" }, sens: "la fête des pères" }
          - { id: c00.s06.A1.d4, texte: { uk: "her father's car", us: "her father's car" }, sens: "la voiture de son père" }
          - { id: c00.s06.A1.d5, texte: { uk: "He's a good father.", us: "He's a good father." }, sens: "C’est un bon père." }
        renvois: [c00.s06.A2]
      - id: c00.s06.A2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [prelude, deux-accents]
        fonctions: [ecouter]
        enonces:
          - id: c00.s06.A2.e1
            region: commun
            texte: { uk: "farther", us: "farther" }
            jeu: { contexte: "Saying the word clearly and naturally in your own accent: 'farther'.", emotion: "clear, friendly" }
        sens: plus loin
        usage: >-
          Le r de <en>far</en> reste muet à Londres, mais sonne à Chicago. L’Américain entend
          donc deux mots là où le Londonien n’en entend qu’un.
        declinaisons:
          - { id: c00.s06.A2.d1, texte: { uk: "It's farther than I thought.", us: "It's farther than I thought." }, sens: "C’est plus loin que je ne pensais." }
          - { id: c00.s06.A2.d2, texte: { uk: "How much farther?", us: "How much farther?" }, sens: "C’est encore loin ?" }
          - { id: c00.s06.A2.d3, texte: { uk: "I can't walk any farther.", us: "I can't walk any farther." }, sens: "Je ne peux pas aller plus loin." }
          - { id: c00.s06.A2.d4, texte: { uk: "farther down the road", us: "farther down the road" }, sens: "plus loin sur la route" }
