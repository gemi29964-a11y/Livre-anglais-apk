            texte: { uk: "coat", us: "coat" }
            jeu: { contexte: "Saying the word clearly and naturally in your own accent: 'coat'.", emotion: "clear, friendly" }
        sens: le manteau
        usage: >-
          Le o de <en>go</en> voyage aussi : əʊ à Londres (on part d’un e), oʊ à Chicago (on
          part d’un o rond). <en>Coat</en> le montre bien.
        declinaisons:
          - { id: c00.s06.C1.d1, texte: { uk: "Put your coat on.", us: "Put your coat on." }, sens: "Mets ton manteau." }
