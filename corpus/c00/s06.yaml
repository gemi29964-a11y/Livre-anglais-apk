    - { id: c00.s06.sv.l09, personnage: sarah, texte: { uk: "Brilliant. I'll take two pieces.", us: "Awesome. I'll take two pieces." }, sens: "Parfait. J’en prends deux morceaux.", emotion: "pleased" }
    - { id: c00.s06.sv.l10, personnage: passage_h, texte: { uk: "Card or cash?", us: "Card or cash?" }, sens: "Carte ou espèces ?", emotion: "brisk" }
    - { id: c00.s06.sv.l11, personnage: sarah, texte: { uk: "Card, please.", us: "Card, please." }, sens: "Par carte, s’il vous plaît.", emotion: "warm" }
    - { id: c00.s06.sv.l12, personnage: passage_h, texte: { uk: "There you go. Have a nice day!", us: "There you go. Have a nice day!" }, sens: "Voilà. Bonne journée !", emotion: "cheerful" }
rituel:
  - "Aujourd’hui, écoutez la même phrase dans les deux versions et repérez le r final."
  - "Ce soir, dites <en>hot</en>, <en>go</en> et <en>can’t</en> dans l’accent de votre choix, trois fois chacun."
