    - { id: c00.s06.sv.l04, personnage: passage_h, texte: { uk: "Sorry, I can't hear you. It's so loud here.", us: "Sorry, I can't hear you. It's so loud here." }, sens: "Pardon, je ne vous entends pas. C’est bruyant ici.", emotion: "leaning in" }
