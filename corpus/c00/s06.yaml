            jeu: { contexte: "Saying the word clearly and naturally in your own accent: 'hot'.", emotion: "clear, friendly" }
        sens: chaud
        usage: >-
          Le o de <en>hot</en> est arrondi et bref à Londres (hɒt), ouvert et plus long à
          Chicago (hɑt), presque « hât ». Les deux se distinguent de <en>heart</en> : par la
          longueur à Londres, par le r à Chicago.
        declinaisons:
          - { id: c00.s06.B1.d1, texte: { uk: "It's hot today.", us: "It's hot today." }, sens: "Il fait chaud aujourd’hui." }
          - { id: c00.s06.B1.d2, texte: { uk: "Careful, it's hot!", us: "Careful, it's hot!" }, sens: "Attention, c’est chaud !" }
          - { id: c00.s06.B1.d3, texte: { uk: "a hot drink", us: "a hot drink" }, sens: "une boisson chaude" }
          - { id: c00.s06.B1.d4, texte: { uk: "hot water", us: "hot water" }, sens: "de l’eau chaude" }
          - { id: c00.s06.B1.d5, texte: { uk: "I'm too hot.", us: "I'm too hot." }, sens: "J’ai trop chaud." }
        renvois: [c00.s06.B2]
