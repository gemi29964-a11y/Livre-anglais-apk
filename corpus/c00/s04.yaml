essentiel:
  incontournables: [c00.s04.A1, c00.s04.A2, c00.s04.A3, c00.s04.A4, c00.s04.B1, c00.s04.B2, c00.s04.C1, c00.s04.C2, c00.s04.C7, c00.s04.C8]
  fauxPas:
    - fautif: "I CAN come."
      naturel: "I can COME."
      pourquoi: "Dans l’affirmation, <en>can</en> s’efface en kən ; appuyé, il sonne comme une protestation, ou comme <en>can’t</en>."
    - fautif: "I can come. (pour dire non)"
      naturel: "I can't come."
      pourquoi: "Le négatif se reconnaît à la voyelle pleine et au double battement, bien avant le t."
    - fautif: "I call you tomorrow."
      naturel: "I'll call you tomorrow."
      pourquoi: "Le futur tient dans un l : sans lui, la phrase décrit une habitude."
    - fautif: "Tell HIM. (en criant le h)"
      naturel: "Tell him."
      pourquoi: "Dans la phrase, le h de <en>him</en> et de <en>her</en> tombe : tel-im, ask-ə. Le prononcer fort met l’accent sur la personne."
    - fautif: "It's for Mum. (pour dire de la part de)"
      naturel: "It's from Mum."
      pourquoi: "<en>For</en> et <en>from</en> sont faibles tous les deux ; seul le m final de <en>from</en> les sépare."
sceneVivante:
  titre: Au téléphone
  repliques:
    - { id: c00.s04.sv.l01, personnage: sarah, texte: { uk: "Hi, it's me. I can't come tonight.", us: "Hi, it's me. I can't come tonight." }, sens: "Salut, c’est moi. Je ne peux pas venir ce soir.", emotion: "apologetic, on the phone" }
    - { id: c00.s04.sv.l02, personnage: tom, texte: { uk: "You can't? Or you can?", us: "You can't? Or you can?" }, sens: "Tu ne peux pas ? Ou tu peux ?", emotion: "confused, bad line" }
    - { id: c00.s04.sv.l03, personnage: sarah, texte: { uk: "I can't. Mia's ill.", us: "I can't. Mia's sick." }, sens: "Je ne peux pas. Mia est malade.", emotion: "patient, a little louder" }
    - { id: c00.s04.sv.l04, personnage: tom, texte: { uk: "Oh no. Tell her I said hi.", us: "Oh no. Tell her I said hi." }, sens: "Oh non. Dis-lui bonjour de ma part.", emotion: "sympathetic" }
    - { id: c00.s04.sv.l05, personnage: sarah, texte: { uk: "I'll tell her. She's asleep now.", us: "I'll tell her. She's asleep now." }, sens: "Je le lui dirai. Elle dort, là.", emotion: "soft, tired" }
    - { id: c00.s04.sv.l06, personnage: tom, texte: { uk: "I've got a present for her. It's from Mum.", us: "I have a present for her. It's from Mom." }, sens: "J’ai un cadeau pour elle. C’est de la part de maman.", emotion: "warm" }
    - { id: c00.s04.sv.l07, personnage: sarah, texte: { uk: "That's sweet. You'll see her on Sunday.", us: "That's sweet. You'll see her on Sunday." }, sens: "C’est gentil. Tu la verras dimanche.", emotion: "touched" }
    - { id: c00.s04.sv.l08, personnage: tom, texte: { uk: "We'd love to. Tea or coffee?", us: "We'd love to. Tea or coffee?" }, sens: "Avec plaisir. Thé ou café ?", emotion: "cheerful, joking" }
    - { id: c00.s04.sv.l09, personnage: sarah, texte: { uk: "Tea and cake, please.", us: "Tea and cake, please." }, sens: "Du thé et du gâteau, s’il te plaît.", emotion: "laughing" }
    - { id: c00.s04.sv.l10, personnage: tom, texte: { uk: "You can't have both!", us: "You can't have both!" }, sens: "Tu ne peux pas avoir les deux !", emotion: "teasing" }
    - { id: c00.s04.sv.l11, personnage: sarah, texte: { uk: "Watch me.", us: "Watch me." }, sens: "Tu vas voir.", emotion: "mock defiant, smiling" }
rituel:
  - "Aujourd’hui, dites <en>I can go</en> puis <en>I can’t go</en> : un battement, puis deux."
  - "Ce soir, terminez une conversation par <en>I’ll call you</en>, le l à peine posé."
