        sens: "Il n’y a plus de dentifrice."
        motAMot: "nous sommes dehors de dentifrice"
        usage: >-
          <en>We’re out of</en> + chose : « on n’a plus de ». Formule clé des courses :
          <en>We’re out of milk</en>, <en>We’re out of bread</en>.
        gabarit: "We're out of [produit]."
        declinaisons:
          - { id: c01.s02.C2.d1, texte: { uk: "We're out of milk.", us: "We're out of milk." }, sens: "On n’a plus de lait." }
          - { id: c01.s02.C2.d2, texte: { uk: "We're running out of soap.", us: "We're running out of soap." }, sens: "On n’a presque plus de savon." }
          - { id: c01.s02.C2.d3, texte: { uk: "Are we out of shampoo?", us: "Are we out of shampoo?" }, sens: "On n’a plus de shampoing ?" }
          - { id: c01.s02.C2.d4, texte: { uk: "We've run out of toothpaste.", us: "We've run out of toothpaste." }, sens: "On est à court de dentifrice." }
          - { id: c01.s02.C2.d5, texte: { uk: "Add it to the list.", us: "Add it to the list." }, sens: "Note-le sur la liste." }
        renvois: []
      - id: c01.s02.C3
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [maison]
        fonctions: [demander]
        enonces:
          - id: c01.s02.C3.e1
            region: commun
            texte: { uk: "Can I borrow your toothbrush?", us: "Can I borrow your toothbrush?" }
