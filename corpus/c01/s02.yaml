          - { id: c01.s02.C4.d1, texte: { uk: "Rinse the sink after you.", us: "Rinse the sink after you." }, sens: "Rince le lavabo après toi." }
          - { id: c01.s02.C4.d2, texte: { uk: "Rinse it under the tap.", us: "Rinse it under the faucet." }, sens: "Rince-le sous le robinet." }
          - { id: c01.s02.C4.d3, texte: { uk: "Rinse your hair well.", us: "Rinse your hair well." }, sens: "Rince-toi bien les cheveux." }
          - { id: c01.s02.C4.d4, texte: { uk: "Rinse and spit.", us: "Rinse and spit." }, sens: "Rince et crache." }
          - { id: c01.s02.C4.d5, texte: { uk: "Give it a quick rinse.", us: "Give it a quick rinse." }, sens: "Rince-le vite fait." }
        renvois: []
      - id: c01.s02.C5
        ton: complice
        niveau: fondations
        frequence: 3
        situations: [matin, maison, famille]
        fonctions: [presser]
        enonces:
          - id: c01.s02.C5.e1
            region: commun
            texte: { uk: "Spit it out!", us: "Spit it out!" }
            jeu: { contexte: "Telling a child to spit out toothpaste, not swallow it.", emotion: "urgent, half-laughing" }
        sens: "Crache !"
        usage: >-
          Au sens propre : crache. Au sens figuré, très courant : « accouche, dis-le ! » quand
          quelqu’un hésite à parler.
        declinaisons:
          - { id: c01.s02.C5.d1, texte: { uk: "Don't swallow it, spit it out.", us: "Don't swallow it, spit it out." }, sens: "Ne l’avale pas, crache-le." }
          - { id: c01.s02.C5.d2, texte: { uk: "Come on, spit it out!", us: "Come on, spit it out!" }, sens: "Allez, accouche !" }
          - { id: c01.s02.C5.d3, texte: { uk: "Just spit it out.", us: "Just spit it out." }, sens: "Dis-le, c’est tout." }
          - { id: c01.s02.C5.d4, texte: { uk: "Spit in the sink, not on the mirror.", us: "Spit in the sink, not on the mirror." }, sens: "Crache dans le lavabo, pas sur le miroir." }
          - { id: c01.s02.C5.d5, texte: { uk: "What is it? Spit it out.", us: "What is it? Spit it out." }, sens: "Qu’est-ce qu’il y a ? Dis-le." }
        renvois: []
  - lettre: D
    titre: Devant le miroir
    expressions:
      - id: c01.s02.D1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [se-plaindre]
        enonces:
          - id: c01.s02.D1.e1
            region: commun
            texte: { uk: "I look awful.", us: "I look awful." }
            jeu: { contexte: "Looking in the mirror first thing in the morning.", emotion: "groaning, self-mocking" }
        sens: "J’ai une tête affreuse."
        usage: >-
          <en>Awful</en> : affreux. On dit <en>look</en> + adjectif pour l’apparence : <en>You
          look great</en>, <en>You look tired</en>. L’autre répond souvent <en>No, you
          don’t!</en>
        gabarit: "I look [adjectif]."
        declinaisons:
          - { id: c01.s02.D1.d1, texte: { uk: "You look tired.", us: "You look tired." }, sens: "Tu as l’air fatigué." }
          - { id: c01.s02.D1.d2, texte: { uk: "I look like a zombie.", us: "I look like a zombie." }, sens: "J’ai une tête de zombie." }
          - { id: c01.s02.D1.d3, texte: { uk: "You look great!", us: "You look great!" }, sens: "Tu as une mine superbe !" }
          - { id: c01.s02.D1.d4, texte: { uk: "I look terrible in this light.", us: "I look terrible in this light." }, sens: "Cette lumière me donne une tête horrible." }
          - { id: c01.s02.D1.d5, texte: { uk: "Do I look okay?", us: "Do I look okay?" }, sens: "Ça va, j’ai l’air de quoi ?" }
        renvois: []
      - id: c01.s02.D2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.D2.e1
            region: commun
            texte: { uk: "My hair's a mess.", us: "My hair's a mess." }
            jeu: { contexte: "Staring at your bed hair in the mirror.", emotion: "dismayed" }
        sens: "Mes cheveux sont en bataille."
        usage: >-
          <en>A mess</en>, c’est le désordre. Pour les cheveux, la chambre, la vie : <en>My
          room’s a mess</en>, <en>I’m a mess</en>.
        gabarit: "My [chose]'s a mess."
        declinaisons:
          - { id: c01.s02.D2.d1, texte: { uk: "My room's a mess.", us: "My room's a mess." }, sens: "Ma chambre est en désordre." }
          - { id: c01.s02.D2.d2, texte: { uk: "Your hair's sticking up.", us: "Your hair's sticking up." }, sens: "Tes cheveux rebiquent." }
          - { id: c01.s02.D2.d3, texte: { uk: "I'm a mess today.", us: "I'm a mess today." }, sens: "Je ne suis pas en forme aujourd’hui." }
          - { id: c01.s02.D2.d4, texte: { uk: "The kitchen's a total mess.", us: "The kitchen's a total mess." }, sens: "La cuisine est un vrai chantier." }
          - { id: c01.s02.D2.d5, texte: { uk: "Sorry about the mess.", us: "Sorry about the mess." }, sens: "Désolé pour le désordre." }
        renvois: []
      - id: c01.s02.D3
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [se-plaindre]
        enonces:
          - id: c01.s02.D3.e1
            region: commun
            texte: { uk: "I've got a spot on my nose.", us: "I have a zit on my nose." }
            jeu: { contexte: "Leaning close to the mirror, examining your face.", emotion: "annoyed, a little vain" }
        sens: "J’ai une imperfection sur le nez."
        usage: >-
          Londres dit <en>a spot</en>, l’Amérique <en>a zit</en> ou <en>a pimple</en>.
          <en>I’ve got</en> est la forme britannique de <en>I have</en>.
        declinaisons:
          - { id: c01.s02.D3.d1, texte: { uk: "Don't pick it!", us: "Don't pick it!" }, sens: "Ne le touche pas !" }
          - { id: c01.s02.D3.d2, texte: { uk: "I've got a huge spot.", us: "I have a huge zit." }, sens: "J’ai une énorme imperfection." }
          - { id: c01.s02.D3.d3, texte: { uk: "Is it really noticeable?", us: "Is it really noticeable?" }, sens: "Ça se voit vraiment ?" }
          - { id: c01.s02.D3.d4, texte: { uk: "I always get spots before a big day.", us: "I always get zits before a big day." }, sens: "J’ai toujours des imperfections avant un grand jour." }
          - { id: c01.s02.D3.d5, texte: { uk: "You can't even see it.", us: "You can't even see it." }, sens: "On ne le voit même pas." }
        renvois: []
      - id: c01.s02.D4
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [se-plaindre]
        enonces:
          - id: c01.s02.D4.e1
            region: commun
            texte: { uk: "I've got bags under my eyes.", us: "I have bags under my eyes." }
            jeu: { contexte: "Touching the skin under your eyes after a short night.", emotion: "tired, rueful" }
        sens: "J’ai des cernes."
        usage: >-
          <en>Bags</en> : des poches sous les yeux. Les cernes sombres se disent aussi
          <en>dark circles</en>.
        declinaisons:
          - { id: c01.s02.D4.d1, texte: { uk: "I've got dark circles.", us: "I have dark circles." }, sens: "J’ai les yeux cernés." }
          - { id: c01.s02.D4.d2, texte: { uk: "You look like you haven't slept.", us: "You look like you haven't slept." }, sens: "Tu as l’air de ne pas avoir dormi." }
          - { id: c01.s02.D4.d3, texte: { uk: "My eyes are all puffy.", us: "My eyes are all puffy." }, sens: "J’ai les yeux tout gonflés." }
          - { id: c01.s02.D4.d4, texte: { uk: "I need some concealer.", us: "I need some concealer." }, sens: "Il me faut de l’anticernes." }
          - { id: c01.s02.D4.d5, texte: { uk: "I only slept four hours.", us: "I only slept four hours." }, sens: "Je n’ai dormi que quatre heures." }
        renvois: []
      - id: c01.s02.D5
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.D5.e1
            region: commun
            texte: { uk: "I need a haircut.", us: "I need a haircut." }
            jeu: { contexte: "Pushing your fringe out of your eyes in the mirror.", emotion: "resigned" }
        sens: "Il faut que je me fasse couper les cheveux."
        usage: >-
          On ne se coupe pas les cheveux soi-même en anglais : on <en>gets a haircut</en>.
          <en>I had my hair cut</en>, « je me suis fait couper les cheveux ».
        declinaisons:
          - { id: c01.s02.D5.d1, texte: { uk: "I'm getting my hair cut on Saturday.", us: "I'm getting my hair cut on Saturday." }, sens: "Je vais chez le coiffeur samedi." }
          - { id: c01.s02.D5.d2, texte: { uk: "Have you had your hair cut?", us: "Have you gotten a haircut?" }, sens: "Tu t’es fait couper les cheveux ?" }
          - { id: c01.s02.D5.d3, texte: { uk: "I love your new haircut!", us: "I love your new haircut!" }, sens: "J’adore ta nouvelle coupe !" }
          - { id: c01.s02.D5.d4, texte: { uk: "It's getting too long.", us: "It's getting too long." }, sens: "Ils deviennent trop longs." }
          - { id: c01.s02.D5.d5, texte: { uk: "Just a trim, please.", us: "Just a trim, please." }, sens: "Juste rafraîchir les pointes, s’il vous plaît." }
        renvois: []
  - lettre: E
    titre: Se raser, se maquiller
    expressions:
      - id: c01.s02.E1
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.E1.e1
            region: commun
            texte: { uk: "I need a shave.", us: "I need a shave." }
            jeu: { contexte: "Rubbing your stubbly chin in the mirror.", emotion: "matter-of-fact" }
        sens: "Il faut que je me rase."
        usage: >-
          <en>Shave</en> : se raser. <en>I need a shave</en> se dit d’une barbe de deux jours.
          Le verbe seul suffit : <en>I’m shaving</en>.
        declinaisons:
          - { id: c01.s02.E1.d1, texte: { uk: "I'm just shaving.", us: "I'm just shaving." }, sens: "Je suis en train de me raser." }
          - { id: c01.s02.E1.d2, texte: { uk: "You haven't shaved.", us: "You haven't shaved." }, sens: "Tu ne t’es pas rasé." }
          - { id: c01.s02.E1.d3, texte: { uk: "I'm growing a beard.", us: "I'm growing a beard." }, sens: "Je me laisse pousser la barbe." }
          - { id: c01.s02.E1.d4, texte: { uk: "I shave every other day.", us: "I shave every other day." }, sens: "Je me rase un jour sur deux." }
          - { id: c01.s02.E1.d5, texte: { uk: "Your beard's getting long.", us: "Your beard's getting long." }, sens: "Ta barbe devient longue." }
        renvois: []
      - id: c01.s02.E2
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [matin, maison]
        fonctions: [raconter]
        enonces:
          - id: c01.s02.E2.e1
            region: commun
            texte: { uk: "I cut myself shaving.", us: "I cut myself shaving." }
            jeu: { contexte: "Dabbing your chin with tissue.", emotion: "wincing, annoyed" }
        sens: "Je me suis coupé en me rasant."
        usage: >-
          <en>Cut myself</en> : le pronom réfléchi est obligatoire quand on se blesse soi-
          même. Suivi d’un verbe en <en>-ing</en> pour dire comment.
        gabarit: "I [verbe] myself [verbe-ing]."
        declinaisons:
          - { id: c01.s02.E2.d1, texte: { uk: "I burnt myself cooking.", us: "I burned myself cooking." }, sens: "Je me suis brûlé en cuisinant." }
          - { id: c01.s02.E2.d2, texte: { uk: "Have you cut yourself?", us: "Have you cut yourself?" }, sens: "Tu t’es coupé ?" }
          - { id: c01.s02.E2.d3, texte: { uk: "It's only a little cut.", us: "It's only a little cut." }, sens: "Ce n’est qu’une petite coupure." }
          - { id: c01.s02.E2.d4, texte: { uk: "It won't stop bleeding.", us: "It won't stop bleeding." }, sens: "Ça n’arrête pas de saigner." }
          - { id: c01.s02.E2.d5, texte: { uk: "Have we got any plasters?", us: "Do we have any Band-Aids?" }, sens: "On a des pansements ?" }
        renvois: []
      - id: c01.s02.E3
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [annoncer]
        enonces:
          - id: c01.s02.E3.e1
            region: commun
            texte: { uk: "I'm doing my make-up.", us: "I'm doing my makeup." }
            jeu: { contexte: "Leaning into the mirror, eyeliner in hand.", emotion: "focused, slightly distracted" }
        sens: "Je me maquille."
        usage: >-
          On <en>does</en> son maquillage, ou on le <en>puts on</en>. <en>Take it off</en>
          pour le démaquillage. Londres écrit <en>make-up</en>, l’Amérique <en>makeup</en>.
        declinaisons:
          - { id: c01.s02.E3.d1, texte: { uk: "I'm just putting my make-up on.", us: "I'm just putting my makeup on." }, sens: "Je finis de me maquiller." }
          - { id: c01.s02.E3.d2, texte: { uk: "I'm not wearing any make-up.", us: "I'm not wearing any makeup." }, sens: "Je ne suis pas maquillée." }
          - { id: c01.s02.E3.d3, texte: { uk: "Don't talk to me, I'm doing my eyeliner.", us: "Don't talk to me, I'm doing my eyeliner." }, sens: "Ne me parle pas, je fais mon trait d’eye-liner." }
          - { id: c01.s02.E3.d4, texte: { uk: "I need to take my make-up off.", us: "I need to take my makeup off." }, sens: "Il faut que je me démaquille." }
          - { id: c01.s02.E3.d5, texte: { uk: "Can I borrow your mascara?", us: "Can I borrow your mascara?" }, sens: "Je peux t’emprunter ton mascara ?" }
        renvois: []
      - id: c01.s02.E4
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [demander]
        enonces:
          - id: c01.s02.E4.e1
            region: commun
            texte: { uk: "Have you seen my razor?", us: "Have you seen my razor?" }
            jeu: { contexte: "Searching the bathroom shelf.", emotion: "searching, mildly suspicious" }
        sens: "Tu as vu mon rasoir ?"
        usage: >-
          <en>Have you seen…?</en> est la formule pour chercher un objet égaré, à Londres
          comme à Chicago. La réponse : <en>It’s where you left it.</en>
        gabarit: "Have you seen my [objet]?"
        declinaisons:
          - { id: c01.s02.E4.d1, texte: { uk: "Have you seen my glasses?", us: "Have you seen my glasses?" }, sens: "Tu as vu mes lunettes ?" }
          - { id: c01.s02.E4.d2, texte: { uk: "Has anyone seen my hairbrush?", us: "Has anyone seen my hairbrush?" }, sens: "Quelqu’un a vu ma brosse ?" }
          - { id: c01.s02.E4.d3, texte: { uk: "Where did you put it?", us: "Where did you put it?" }, sens: "Où est-ce que tu l’as mis ?" }
          - { id: c01.s02.E4.d4, texte: { uk: "It's where you left it.", us: "It's where you left it." }, sens: "Il est là où tu l’as laissé." }
          - { id: c01.s02.E4.d5, texte: { uk: "I can't find my tweezers.", us: "I can't find my tweezers." }, sens: "Je ne trouve pas ma pince à épiler." }
        renvois: []
      - id: c01.s02.E5
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [demander]
        enonces:
          - id: c01.s02.E5.e1
            region: commun
            texte: { uk: "Can you pass me a towel?", us: "Can you pass me a towel?" }
            jeu: { contexte: "Dripping wet in the shower, reaching out.", emotion: "shivering, polite" }
        sens: "Tu peux me passer une serviette ?"
        usage: >-
          <en>Pass me</en> + objet : la demande polie de tous les jours, à table comme à la
          salle de bain.
        gabarit: "Can you pass me [objet]?"
        declinaisons:
          - { id: c01.s02.E5.d1, texte: { uk: "Pass me the soap, please.", us: "Pass me the soap, please." }, sens: "Passe-moi le savon, s’il te plaît." }
          - { id: c01.s02.E5.d2, texte: { uk: "Can you hand me that?", us: "Can you hand me that?" }, sens: "Tu peux me tendre ça ?" }
          - { id: c01.s02.E5.d3, texte: { uk: "There's a clean towel on the rail.", us: "There's a clean towel on the rack." }, sens: "Il y a une serviette propre sur le porte-serviettes." }
          - { id: c01.s02.E5.d4, texte: { uk: "This towel's soaking.", us: "This towel's soaking." }, sens: "Cette serviette est trempée." }
          - { id: c01.s02.E5.d5, texte: { uk: "Can you grab me a towel?", us: "Can you grab me a towel?" }, sens: "Tu peux m’attraper une serviette ?" }
        renvois: []
  - lettre: F
    titre: Les cheveux
    expressions:
      - id: c01.s02.F1
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [annoncer]
        enonces:
          - id: c01.s02.F1.e1
            region: commun
            texte: { uk: "I'm washing my hair.", us: "I'm washing my hair." }
            jeu: { contexte: "Calling out from the shower when someone asks what's taking so long.", emotion: "slightly defensive" }
        sens: "Je me lave les cheveux."
        usage: >-
          Encore le possessif : <en>my hair</en>. Attention, <en>hair</en> est indénombrable :
          <en>my hair is long</en>, jamais <en>hairs</en> pour la chevelure.
        declinaisons:
          - { id: c01.s02.F1.d1, texte: { uk: "I washed my hair last night.", us: "I washed my hair last night." }, sens: "Je me suis lavé les cheveux hier soir." }
          - { id: c01.s02.F1.d2, texte: { uk: "My hair is still wet.", us: "My hair is still wet." }, sens: "J’ai encore les cheveux mouillés." }
          - { id: c01.s02.F1.d3, texte: { uk: "I need to wash my hair.", us: "I need to wash my hair." }, sens: "Il faut que je me lave les cheveux." }
          - { id: c01.s02.F1.d4, texte: { uk: "Your hair looks nice.", us: "Your hair looks nice." }, sens: "Tes cheveux sont jolis." }
          - { id: c01.s02.F1.d5, texte: { uk: "I've found a grey hair!", us: "I found a gray hair!" }, sens: "J’ai trouvé un cheveu blanc !" }
        renvois: []
      - id: c01.s02.F2
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [matin, maison]
        fonctions: [demander]
        enonces:
          - id: c01.s02.F2.e1
            region: commun
            texte: { uk: "Where's the hairdryer?", us: "Where's the hairdryer?" }
            jeu: { contexte: "Rummaging in a drawer with wet hair.", emotion: "hurried" }
        sens: "Où est le sèche-cheveux ?"
        usage: >-
          <en>Hairdryer</en> ou <en>hair dryer</en>. Le verbe : <en>blow-dry</en>, « faire un
          brushing ».
        declinaisons:
          - { id: c01.s02.F2.d1, texte: { uk: "I'll just dry my hair.", us: "I'll just dry my hair." }, sens: "Je me sèche juste les cheveux." }
          - { id: c01.s02.F2.d2, texte: { uk: "Can I use your hairdryer?", us: "Can I use your hairdryer?" }, sens: "Je peux prendre ton sèche-cheveux ?" }
          - { id: c01.s02.F2.d3, texte: { uk: "The hairdryer's too loud.", us: "The hairdryer's too loud." }, sens: "Le sèche-cheveux fait trop de bruit." }
          - { id: c01.s02.F2.d4, texte: { uk: "I'll let it dry naturally.", us: "I'll let it dry naturally." }, sens: "Je vais les laisser sécher à l’air." }
          - { id: c01.s02.F2.d5, texte: { uk: "Where did you put the straighteners?", us: "Where did you put the flat iron?" }, sens: "Où as-tu mis le lisseur ?" }
        renvois: []
      - id: c01.s02.F3
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [expliquer]
        enonces:
          - id: c01.s02.F3.e1
            region: commun
            texte: { uk: "My hair takes ages to dry.", us: "My hair takes forever to dry." }
            jeu: { contexte: "Explaining why you're late, towel on your head.", emotion: "apologetic" }
        sens: "Mes cheveux mettent des heures à sécher."
        usage: >-
          <en>Ages</en> (Londres) ou <en>forever</en> (Amérique) : une éternité. <en>It
          takes</en> + durée + <en>to</en> + verbe : la structure pour dire le temps qu’il
          faut.
        gabarit: "It takes [durée] to [verbe]."
        declinaisons:
          - { id: c01.s02.F3.d1, texte: { uk: "It takes ages.", us: "It takes forever." }, sens: "Ça prend une éternité." }
          - { id: c01.s02.F3.d2, texte: { uk: "It takes ten minutes to get there.", us: "It takes ten minutes to get there." }, sens: "Il faut dix minutes pour y aller." }
          - { id: c01.s02.F3.d3, texte: { uk: "How long does it take?", us: "How long does it take?" }, sens: "Ça prend combien de temps ?" }
          - { id: c01.s02.F3.d4, texte: { uk: "I've been waiting for ages.", us: "I've been waiting forever." }, sens: "J’attends depuis des lustres." }
          - { id: c01.s02.F3.d5, texte: { uk: "It won't take long.", us: "It won't take long." }, sens: "Ça ne prendra pas longtemps." }
        renvois: []
      - id: c01.s02.F4
        ton: complice
        niveau: fondations
        frequence: 3
        situations: [matin, maison]
        fonctions: [se-plaindre]
        enonces:
          - id: c01.s02.F4.e1
            region: commun
            texte: { uk: "I'm having a bad hair day.", us: "I'm having a bad hair day." }
            jeu: { contexte: "Giving up on your hair in the mirror.", emotion: "mock despair" }
        sens: "Mes cheveux ne ressemblent à rien aujourd’hui."
        usage: >-
          Une journée où les cheveux refusent d’obéir, et par extension une journée où rien ne
          va. Expression drôle et très courante.
        declinaisons:
          - { id: c01.s02.F4.d1, texte: { uk: "It's a bad hair day.", us: "It's a bad hair day." }, sens: "Mes cheveux font ce qu’ils veulent." }
          - { id: c01.s02.F4.d2, texte: { uk: "Everyone has bad hair days.", us: "Everyone has bad hair days." }, sens: "Tout le monde a des jours sans." }
          - { id: c01.s02.F4.d3, texte: { uk: "My hair won't do anything.", us: "My hair won't do anything." }, sens: "Mes cheveux ne tiennent pas." }
          - { id: c01.s02.F4.d4, texte: { uk: "I'll wear a hat.", us: "I'll wear a hat." }, sens: "Je vais mettre un bonnet." }
          - { id: c01.s02.F4.d5, texte: { uk: "I'll just tie it up.", us: "I'll just tie it up." }, sens: "Je vais juste les attacher." }
        renvois: []
      - id: c01.s02.F5
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison, famille]
        fonctions: [demander]
        enonces:
          - id: c01.s02.F5.e1
            region: commun
            texte: { uk: "Can you do my hair?", us: "Can you do my hair?" }
            jeu: { contexte: "A child holding out a hairbrush and hair ties to a parent.", emotion: "pleading, sweet" }
        sens: "Tu peux me coiffer ?"
        usage: >-
          <en>Do someone’s hair</en> : coiffer quelqu’un. Pour les tresses : <en>Can you plait
          my hair?</en> (Londres) ou <en>braid</en> (Amérique).
        declinaisons:
          - { id: c01.s02.F5.d1, texte: { uk: "Can you plait my hair?", us: "Can you braid my hair?" }, sens: "Tu peux me faire une tresse ?" }
          - { id: c01.s02.F5.d2, texte: { uk: "Stand still, please.", us: "Stand still, please." }, sens: "Ne bouge pas, s’il te plaît." }
          - { id: c01.s02.F5.d3, texte: { uk: "Ouch, that hurts!", us: "Ouch, that hurts!" }, sens: "Aïe, ça fait mal !" }
          - { id: c01.s02.F5.d4, texte: { uk: "Do you want a ponytail?", us: "Do you want a ponytail?" }, sens: "Tu veux une queue de cheval ?" }
          - { id: c01.s02.F5.d5, texte: { uk: "Hold this hair tie.", us: "Hold this hair tie." }, sens: "Tiens cet élastique." }
        renvois: []
  - lettre: G
    titre: Les toilettes
    expressions:
      - id: c01.s02.G1
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison, famille]
        fonctions: [presser]
        enonces:
          - id: c01.s02.G1.e1
            region: commun
            texte: { uk: "We're out of loo roll!", us: "We're out of toilet paper!" }
            jeu: { contexte: "Calling desperately from the toilet.", emotion: "panicked, comic" }
        sens: "Il n’y a plus de papier toilette !"
        usage: >-
          Londres : <en>loo roll</en> ou <en>toilet roll</en> ; Amérique : <en>toilet
          paper</en>. Toujours avec <en>we’re out of</en>.
        declinaisons:
          - { id: c01.s02.G1.d1, texte: { uk: "Is there any more loo roll?", us: "Is there any more toilet paper?" }, sens: "Il reste du papier toilette ?" }
          - { id: c01.s02.G1.d2, texte: { uk: "Can you bring me some loo roll?", us: "Can you bring me some toilet paper?" }, sens: "Tu peux m’apporter du papier toilette ?" }
          - { id: c01.s02.G1.d3, texte: { uk: "It's in the cupboard.", us: "It's in the closet." }, sens: "C’est dans le placard." }
          - { id: c01.s02.G1.d4, texte: { uk: "Who used the last roll?", us: "Who used the last roll?" }, sens: "Qui a fini le rouleau ?" }
          - { id: c01.s02.G1.d5, texte: { uk: "Put a new roll on.", us: "Put a new roll on." }, sens: "Mets un nouveau rouleau." }
        renvois: []
      - id: c01.s02.G2
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.G2.e1
            region: commun
            texte: { uk: "The toilet won't flush.", us: "The toilet won't flush." }
            jeu: { contexte: "Pressing the handle repeatedly.", emotion: "worried" }
        sens: "La chasse d’eau ne marche pas."
        usage: >-
          <en>Won’t</en> + verbe pour un objet qui refuse de fonctionner : <en>The door won’t
          open</en>, <en>The car won’t start</en>. <en>Flush</en>, c’est tirer la chasse.
        gabarit: "The [objet] won't [verbe]."
        declinaisons:
          - { id: c01.s02.G2.d1, texte: { uk: "Don't forget to flush.", us: "Don't forget to flush." }, sens: "N’oublie pas de tirer la chasse." }
          - { id: c01.s02.G2.d2, texte: { uk: "The door won't lock.", us: "The door won't lock." }, sens: "La porte ne ferme pas à clé." }
          - { id: c01.s02.G2.d3, texte: { uk: "The tap won't turn off.", us: "The faucet won't turn off." }, sens: "Le robinet ne se ferme pas." }
          - { id: c01.s02.G2.d4, texte: { uk: "Hold the handle down.", us: "Hold the handle down." }, sens: "Maintiens la poignée enfoncée." }
          - { id: c01.s02.G2.d5, texte: { uk: "We need a plumber.", us: "We need a plumber." }, sens: "Il faut un plombier." }
        renvois: []
      - id: c01.s02.G3
        ton: complice
        niveau: fondations
        frequence: 3
        situations: [maison]
        fonctions: [reprocher]
        enonces:
          - id: c01.s02.G3.e1
            region: commun
            texte: { uk: "Put the seat down!", us: "Put the seat down!" }
            jeu: { contexte: "The eternal household complaint, said with a sigh.", emotion: "exasperated, familiar" }
        sens: "Baisse la lunette !"
        usage: >-
          La plainte universelle des couples. <en>The seat</en> suffit, tout le monde
          comprend. <en>Put it back down</en>, pour insister.
        declinaisons:
          - { id: c01.s02.G3.d1, texte: { uk: "Put the lid down.", us: "Put the lid down." }, sens: "Baisse le couvercle." }
          - { id: c01.s02.G3.d2, texte: { uk: "You left the seat up again.", us: "You left the seat up again." }, sens: "Tu as encore laissé la lunette relevée." }
          - { id: c01.s02.G3.d3, texte: { uk: "How many times do I have to say it?", us: "How many times do I have to say it?" }, sens: "Combien de fois faut-il que je le dise ?" }
          - { id: c01.s02.G3.d4, texte: { uk: "Put it back where it was.", us: "Put it back where it was." }, sens: "Remets-le à sa place." }
          - { id: c01.s02.G3.d5, texte: { uk: "Sorry, I forgot.", us: "Sorry, I forgot." }, sens: "Pardon, j’ai oublié." }
        renvois: []
      - id: c01.s02.G4
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [ordonner]
        enonces:
          - id: c01.s02.G4.e1
            region: commun
            texte: { uk: "Wash your hands!", us: "Wash your hands!" }
            jeu: { contexte: "Calling after a child leaving the toilet.", emotion: "automatic, parental" }
        sens: "Lave-toi les mains !"
        usage: >-
          L’impératif simple, avec le possessif. On ajoute souvent <en>with soap</en> pour les
          enfants.
        gabarit: "Wash your [partie du corps]!"
        declinaisons:
          - { id: c01.s02.G4.d1, texte: { uk: "Wash your hands with soap.", us: "Wash your hands with soap." }, sens: "Lave-toi les mains au savon." }
          - { id: c01.s02.G4.d2, texte: { uk: "Have you washed your hands?", us: "Have you washed your hands?" }, sens: "Tu t’es lavé les mains ?" }
          - { id: c01.s02.G4.d3, texte: { uk: "Dry your hands properly.", us: "Dry your hands properly." }, sens: "Sèche-toi bien les mains." }
          - { id: c01.s02.G4.d4, texte: { uk: "Your hands are still dirty.", us: "Your hands are still dirty." }, sens: "Tu as encore les mains sales." }
          - { id: c01.s02.G4.d5, texte: { uk: "Wash your face too.", us: "Wash your face too." }, sens: "Lave-toi aussi le visage." }
        renvois: []
      - id: c01.s02.G5
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [maison]
        fonctions: [conseiller]
        enonces:
          - id: c01.s02.G5.e1
            region: commun
            texte: { uk: "Lock the door.", us: "Lock the door." }
            jeu: { contexte: "Reminding a guest that the bathroom lock is tricky.", emotion: "helpful" }
        sens: "Ferme à clé."
        usage: >-
          <en>Lock</en>, c’est fermer à clé ou au verrou ; <en>close</en> ou <en>shut</en>,
          simplement fermer. <en>Unlock</en> : déverrouiller.
        declinaisons:
          - { id: c01.s02.G5.d1, texte: { uk: "The lock's a bit stiff.", us: "The lock's a bit stiff." }, sens: "Le verrou est un peu dur." }
          - { id: c01.s02.G5.d2, texte: { uk: "Did you lock it?", us: "Did you lock it?" }, sens: "Tu as fermé à clé ?" }
          - { id: c01.s02.G5.d3, texte: { uk: "I'm locked in!", us: "I'm locked in!" }, sens: "Je suis enfermé !" }
          - { id: c01.s02.G5.d4, texte: { uk: "Shut the door, please.", us: "Shut the door, please." }, sens: "Ferme la porte, s’il te plaît." }
          - { id: c01.s02.G5.d5, texte: { uk: "Knock before you come in.", us: "Knock before you come in." }, sens: "Frappe avant d’entrer." }
        renvois: []
  - lettre: H
    titre: Les petites pannes
    expressions:
      - id: c01.s02.H1
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.H1.e1
            region: commun
            texte: { uk: "The sink's blocked.", us: "The sink's clogged." }
            jeu: { contexte: "Watching the water refuse to drain.", emotion: "annoyed" }
        sens: "Le lavabo est bouché."
        usage: >-
          Londres : <en>blocked</en> ; Amérique : <en>clogged</en>. Le <en>sink</en> est le
          lavabo comme l’évier.
        declinaisons:
          - { id: c01.s02.H1.d1, texte: { uk: "The drain's blocked.", us: "The drain's clogged." }, sens: "L’évacuation est bouchée." }
          - { id: c01.s02.H1.d2, texte: { uk: "It's full of hair.", us: "It's full of hair." }, sens: "C’est plein de cheveux." }
          - { id: c01.s02.H1.d3, texte: { uk: "The water won't go down.", us: "The water won't go down." }, sens: "L’eau ne s’écoule pas." }
          - { id: c01.s02.H1.d4, texte: { uk: "Have we got a plunger?", us: "Do we have a plunger?" }, sens: "On a une ventouse ?" }
          - { id: c01.s02.H1.d5, texte: { uk: "Don't pour that down the sink.", us: "Don't pour that down the sink." }, sens: "Ne verse pas ça dans le lavabo." }
        renvois: []
      - id: c01.s02.H2
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.H2.e1
            region: commun
            texte: { uk: "The tap's dripping.", us: "The faucet's dripping." }
            jeu: { contexte: "Lying awake listening to a drip.", emotion: "irritated" }
        sens: "Le robinet goutte."
        usage: >-
          <en>Tap</en> à Londres, <en>faucet</en> en Amérique. <en>Drip</en>, c’est goutter ;
          <en>leak</en>, fuir.
        declinaisons:
          - { id: c01.s02.H2.d1, texte: { uk: "Can you fix the tap?", us: "Can you fix the faucet?" }, sens: "Tu peux réparer le robinet ?" }
          - { id: c01.s02.H2.d2, texte: { uk: "There's a leak under the sink.", us: "There's a leak under the sink." }, sens: "Il y a une fuite sous le lavabo." }
          - { id: c01.s02.H2.d3, texte: { uk: "Turn the tap off properly.", us: "Turn the faucet off properly." }, sens: "Ferme bien le robinet." }
          - { id: c01.s02.H2.d4, texte: { uk: "It's been dripping all night.", us: "It's been dripping all night." }, sens: "Ça goutte depuis toute la nuit." }
          - { id: c01.s02.H2.d5, texte: { uk: "The shower's leaking.", us: "The shower's leaking." }, sens: "La douche fuit." }
        renvois: []
      - id: c01.s02.H3
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [matin, maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.H3.e1
            region: commun
            texte: { uk: "The mirror's all steamed up.", us: "The mirror's all steamed up." }
            jeu: { contexte: "Wiping the mirror with your hand after a hot shower.", emotion: "mild" }
        sens: "Le miroir est tout embué."
        usage: >-
          <en>Steamed up</en> : couvert de vapeur. Pour les lunettes ou la voiture, on dit
          aussi <en>fogged up</en>.
        declinaisons:
          - { id: c01.s02.H3.d1, texte: { uk: "My glasses are all steamed up.", us: "My glasses are all steamed up." }, sens: "Mes lunettes sont embuées." }
          - { id: c01.s02.H3.d2, texte: { uk: "Open the window.", us: "Open the window." }, sens: "Ouvre la fenêtre." }
          - { id: c01.s02.H3.d3, texte: { uk: "Turn the fan on.", us: "Turn the fan on." }, sens: "Allume la ventilation." }
          - { id: c01.s02.H3.d4, texte: { uk: "The windows are fogged up.", us: "The windows are fogged up." }, sens: "Les vitres sont embuées." }
          - { id: c01.s02.H3.d5, texte: { uk: "I can't see a thing.", us: "I can't see a thing." }, sens: "Je n’y vois rien." }
        renvois: []
      - id: c01.s02.H4
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison, famille]
        fonctions: [reprocher]
        enonces:
          - id: c01.s02.H4.e1
            region: commun
            texte: { uk: "Who left their towel on the floor?", us: "Who left their towel on the floor?" }
            jeu: { contexte: "Picking up a wet towel, looking pointedly at the family.", emotion: "accusing, tired" }
        sens: "Qui a laissé sa serviette par terre ?"
        usage: >-
          <en>Their</en> remplace la personne qu’on ne nomme pas, homme ou femme. Question
          rhétorique : on sait très bien qui.
        gabarit: "Who left [chose] [lieu]?"
        declinaisons:
          - { id: c01.s02.H4.d1, texte: { uk: "Hang your towel up.", us: "Hang your towel up." }, sens: "Accroche ta serviette." }
          - { id: c01.s02.H4.d2, texte: { uk: "Pick it up, please.", us: "Pick it up, please." }, sens: "Ramasse-la, s’il te plaît." }
          - { id: c01.s02.H4.d3, texte: { uk: "Who left the light on?", us: "Who left the light on?" }, sens: "Qui a laissé la lumière allumée ?" }
          - { id: c01.s02.H4.d4, texte: { uk: "Whose is this?", us: "Whose is this?" }, sens: "C’est à qui ?" }
          - { id: c01.s02.H4.d5, texte: { uk: "It wasn't me!", us: "It wasn't me!" }, sens: "C’est pas moi !" }
        renvois: []
      - id: c01.s02.H5
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.H5.e1
            region: commun
            texte: { uk: "The light's gone.", us: "The bulb's out." }
            jeu: { contexte: "Flicking the bathroom light switch, nothing happens.", emotion: "flat, resigned" }
        sens: "L’ampoule a grillé."
        usage: >-
          Londres : <en>the light’s gone</en> ou <en>the bulb’s gone</en> ; Amérique : <en>the
          bulb’s out</en>, <en>the bulb burned out</en>.
        declinaisons:
          - { id: c01.s02.H5.d1, texte: { uk: "We need a new bulb.", us: "We need a new bulb." }, sens: "Il faut une nouvelle ampoule." }
          - { id: c01.s02.H5.d2, texte: { uk: "Can you change the bulb?", us: "Can you change the bulb?" }, sens: "Tu peux changer l’ampoule ?" }
          - { id: c01.s02.H5.d3, texte: { uk: "It's pitch black in here.", us: "It's pitch black in here." }, sens: "Il fait noir comme dans un four, ici." }
          - { id: c01.s02.H5.d4, texte: { uk: "Have we got any spare bulbs?", us: "Do we have any spare bulbs?" }, sens: "On a des ampoules de rechange ?" }
          - { id: c01.s02.H5.d5, texte: { uk: "The bulb's flickering.", us: "The bulb's flickering." }, sens: "L’ampoule clignote." }
        renvois: []
  - lettre: I
    titre: Avec les enfants
    expressions:
      - id: c01.s02.I1
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison, famille]
        fonctions: [ordonner]
        enonces:
          - id: c01.s02.I1.e1
            region: commun
            texte: { uk: "Brush properly!", us: "Brush properly!" }
            jeu: { contexte: "A parent watching a child pretend to brush their teeth.", emotion: "firm, a little amused" }
        sens: "Brosse-toi correctement !"
        usage: >-
          <en>Properly</en> : comme il faut. L’adverbe se place après le verbe : <en>do it
          properly</en>, <en>sit properly</en>.
        declinaisons:
          - { id: c01.s02.I1.d1, texte: { uk: "Do it properly.", us: "Do it properly." }, sens: "Fais-le comme il faut." }
          - { id: c01.s02.I1.d2, texte: { uk: "You're not doing it properly.", us: "You're not doing it properly." }, sens: "Tu ne le fais pas bien." }
          - { id: c01.s02.I1.d3, texte: { uk: "Sit properly.", us: "Sit properly." }, sens: "Assieds-toi correctement." }
          - { id: c01.s02.I1.d4, texte: { uk: "Wash properly behind your ears.", us: "Wash properly behind your ears." }, sens: "Lave-toi bien derrière les oreilles." }
          - { id: c01.s02.I1.d5, texte: { uk: "Do the back ones too.", us: "Do the back ones too." }, sens: "Fais aussi celles du fond." }
        renvois: []
      - id: c01.s02.I2
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison, famille]
        fonctions: [verifier]
        enonces:
          - id: c01.s02.I2.e1
            region: commun
            texte: { uk: "Have you washed your face?", us: "Have you washed your face?" }
            jeu: { contexte: "Inspecting a child's face for breakfast traces.", emotion: "checking" }
        sens: "Tu t’es lavé le visage ?"
        usage: >-
          Toujours le possessif. Le présent parfait <en>have you washed</en> demande si c’est
          fait, maintenant.
        declinaisons:
          - { id: c01.s02.I2.d1, texte: { uk: "Wash your face, it's all sticky.", us: "Wash your face, it's all sticky." }, sens: "Lave-toi le visage, il est tout collant." }
          - { id: c01.s02.I2.d2, texte: { uk: "You've got toothpaste on your chin.", us: "You have toothpaste on your chin." }, sens: "Tu as du dentifrice sur le menton." }
          - { id: c01.s02.I2.d3, texte: { uk: "Use the flannel.", us: "Use the washcloth." }, sens: "Prends le gant de toilette." }
          - { id: c01.s02.I2.d4, texte: { uk: "Let me look at you.", us: "Let me look at you." }, sens: "Fais voir." }
          - { id: c01.s02.I2.d5, texte: { uk: "That's better.", us: "That's better." }, sens: "C’est mieux." }
        renvois: []
      - id: c01.s02.I3
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [maison, famille]
        fonctions: [avertir]
        enonces:
          - id: c01.s02.I3.e1
            region: commun
            texte: { uk: "Not so hot!", us: "Not so hot!" }
            jeu: { contexte: "Testing the bath water with your elbow for a child.", emotion: "careful, warning" }
        sens: "Pas si chaud !"
        usage: >-
          <en>Not so</en> + adjectif : « pas si ». Pour régler la température : <en>a bit
          hotter</en>, <en>a bit colder</en>.
        gabarit: "Not so [adjectif]!"
        declinaisons:
          - { id: c01.s02.I3.d1, texte: { uk: "It's too hot.", us: "It's too hot." }, sens: "C’est trop chaud." }
          - { id: c01.s02.I3.d2, texte: { uk: "Make it a bit cooler.", us: "Make it a bit cooler." }, sens: "Mets-la un peu moins chaude." }
          - { id: c01.s02.I3.d3, texte: { uk: "Is that okay?", us: "Is that okay?" }, sens: "Ça va comme ça ?" }
          - { id: c01.s02.I3.d4, texte: { uk: "Not so fast!", us: "Not so fast!" }, sens: "Pas si vite !" }
          - { id: c01.s02.I3.d5, texte: { uk: "Not so loud!", us: "Not so loud!" }, sens: "Pas si fort !" }
        renvois: []
      - id: c01.s02.I4
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [maison, famille]
        fonctions: [avertir]
        enonces:
          - id: c01.s02.I4.e1
            region: commun
            texte: { uk: "Don't splash!", us: "Don't splash!" }
            jeu: { contexte: "A child kicking water out of the bath.", emotion: "half-laughing, warning" }
        sens: "N’éclabousse pas !"
        usage: >-
          <en>Splash</en> : éclabousser. Le bruit et le geste à la fois, comme notre «
          plouf ».
        declinaisons:
          - { id: c01.s02.I4.d1, texte: { uk: "You're splashing everywhere!", us: "You're splashing everywhere!" }, sens: "Tu éclabousses partout !" }
          - { id: c01.s02.I4.d2, texte: { uk: "Stop splashing your sister.", us: "Stop splashing your sister." }, sens: "Arrête d’éclabousser ta sœur." }
          - { id: c01.s02.I4.d3, texte: { uk: "There's water all over the floor.", us: "There's water all over the floor." }, sens: "Il y a de l’eau partout par terre." }
          - { id: c01.s02.I4.d4, texte: { uk: "Careful, it's slippery.", us: "Careful, it's slippery." }, sens: "Attention, ça glisse." }
          - { id: c01.s02.I4.d5, texte: { uk: "Mind you don't slip.", us: "Watch you don't slip." }, sens: "Fais attention à ne pas glisser." }
