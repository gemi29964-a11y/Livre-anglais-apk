# Scène 1.2 — La salle de bain. Format d'édition (10.4) ; les phrasés sont écrits après la mise en voix (6.1, 7.1.8).
id: c01.s02
titre: La salle de bain
intention: >-
  À la fin de cette scène, vous traversez en anglais le quart d’heure de la salle de
  bain : attendre son tour, se doucher, se brosser les dents, se regarder dans le
  miroir, se coiffer, gérer les petites pannes et les enfants, puis céder la place.
version: 1
moments:
  - lettre: A
    titre: Attendre son tour
    expressions:
      - id: c01.s02.A1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [demander]
        enonces:
          - id: c01.s02.A1.e1
            region: commun
            texte: { uk: "Who's in the bathroom?", us: "Who's in the bathroom?" }
            jeu: { contexte: "Standing outside a locked bathroom door in the morning, knocking.", emotion: "impatient, half-awake" }
        sens: "Qui est dans la salle de bain ?"
        motAMot: "qui est dans la salle de bain"
        usage: >-
          La question rituelle du matin dans une maison à une seule salle de bain. On frappe
          en même temps. Avec <en>in there</en>, elle devient plus directe : <en>Who’s in
          there?</en>
        gabarit: "Who's in [lieu]?"
        declinaisons:
          - { id: c01.s02.A1.d1, texte: { uk: "Who's in there?", us: "Who's in there?" }, sens: "Qui est là-dedans ?" }
          - { id: c01.s02.A1.d2, texte: { uk: "Is someone in the bathroom?", us: "Is someone in the bathroom?" }, sens: "Il y a quelqu’un dans la salle de bain ?" }
          - { id: c01.s02.A1.d3, texte: { uk: "Who's in the shower?", us: "Who's in the shower?" }, sens: "Qui est sous la douche ?" }
          - { id: c01.s02.A1.d4, texte: { uk: "Who's been in the bathroom for an hour?", us: "Who's been in the bathroom for an hour?" }, sens: "Qui squatte la salle de bain depuis une heure ?" }
          - { id: c01.s02.A1.d5, texte: { uk: "Is anyone using the bathroom?", us: "Is anyone using the bathroom?" }, sens: "Quelqu’un se sert de la salle de bain ?" }
        renvois: []
      - id: c01.s02.A2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [demander, presser]
        enonces:
          - id: c01.s02.A2.e1
            region: commun
            texte: { uk: "Are you nearly done?", us: "Are you almost done?" }
            jeu: { contexte: "Knocking gently on the bathroom door, waiting your turn.", emotion: "polite but pressing" }
        sens: "Tu as bientôt fini ?"
        motAMot: "es-tu presque fait"
        usage: >-
          <en>Nearly done</en> (Londres) ou <en>almost done</en> (partout) : « presque fini ».
          On le demande à travers la porte, d’un ton aimable mais qui presse.
        gabarit: "Are you nearly [done]?"
        declinaisons:
          - { id: c01.s02.A2.d1, texte: { uk: "Are you almost done?", us: "Are you almost done?" }, sens: "Tu as presque fini ?" }
          - { id: c01.s02.A2.d2, texte: { uk: "I'm nearly done.", us: "I'm nearly done." }, sens: "J’ai presque fini." }
          - { id: c01.s02.A2.d3, texte: { uk: "Are you done in there?", us: "Are you done in there?" }, sens: "Tu as fini, là-dedans ?" }
          - { id: c01.s02.A2.d4, texte: { uk: "How long are you going to be?", us: "How long are you going to be?" }, sens: "Tu en as encore pour combien de temps ?" }
          - { id: c01.s02.A2.d5, texte: { uk: "Nearly done, two minutes!", us: "Almost done, two minutes!" }, sens: "Presque fini, deux minutes !" }
        renvois: []
      - id: c01.s02.A3
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [presser]
        enonces:
          - id: c01.s02.A3.e1
            region: commun
            texte: { uk: "I need the loo!", us: "I need the bathroom!" }
            jeu: { contexte: "Hopping from foot to foot outside the bathroom door.", emotion: "urgent, comic desperation" }
        sens: "Il faut que j’aille aux toilettes !"
        motAMot: "j’ai besoin des toilettes"
        usage: >-
          À Londres, <en>the loo</en> est le mot familier et poli pour les toilettes ; en
          Amérique, on dit <en>the bathroom</en>, même s’il n’y a pas de baignoire. Évitez
          <en>the toilet</en> en Amérique : c’est la cuvette elle-même.
        declinaisons:
          - { id: c01.s02.A3.d1, texte: { uk: "I really need the loo.", us: "I really need the bathroom." }, sens: "J’ai vraiment besoin d’aller aux toilettes." }
          - { id: c01.s02.A3.d2, texte: { uk: "Can I use your loo?", us: "Can I use your bathroom?" }, sens: "Je peux utiliser vos toilettes ?" }
          - { id: c01.s02.A3.d3, texte: { uk: "Where's the loo?", us: "Where's the bathroom?" }, sens: "Où sont les toilettes ?" }
          - { id: c01.s02.A3.d4, texte: { uk: "I'm just going to the loo.", us: "I'm just going to the bathroom." }, sens: "Je vais juste aux toilettes." }
          - { id: c01.s02.A3.d5, texte: { uk: "Go to the loo before we leave.", us: "Go to the bathroom before we leave." }, sens: "Va aux toilettes avant qu’on parte." }
        renvois: []
      - id: c01.s02.A4
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [presser]
        enonces:
          - id: c01.s02.A4.e1
            region: commun
            texte: { uk: "Hurry up in there!", us: "Hurry up in there!" }
            jeu: { contexte: "Banging on the door, already late for work.", emotion: "exasperated, loud" }
        sens: "Dépêche-toi, là-dedans !"
        motAMot: "dépêche-toi là-dedans"
        usage: >-
          <en>Hurry up</en>, c’est « dépêche-toi ». <en>In there</en> désigne la pièce où se
          trouve l’autre. Entre proches, c’est vif sans être blessant.
        declinaisons:
          - { id: c01.s02.A4.d1, texte: { uk: "Hurry up, I'm late!", us: "Hurry up, I'm late!" }, sens: "Dépêche-toi, je suis en retard !" }
          - { id: c01.s02.A4.d2, texte: { uk: "Can you hurry up?", us: "Can you hurry up?" }, sens: "Tu peux te dépêcher ?" }
          - { id: c01.s02.A4.d3, texte: { uk: "Hurry up, the bus is coming!", us: "Hurry up, the bus is coming!" }, sens: "Dépêche-toi, le bus arrive !" }
          - { id: c01.s02.A4.d4, texte: { uk: "There's no need to hurry.", us: "There's no need to hurry." }, sens: "Rien ne presse." }
          - { id: c01.s02.A4.d5, texte: { uk: "Come on, hurry up!", us: "Come on, hurry up!" }, sens: "Allez, grouille-toi !" }
        renvois: []
      - id: c01.s02.A5
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [rassurer]
        enonces:
          - id: c01.s02.A5.e1
            region: commun
            texte: { uk: "I'll be out in a minute.", us: "I'll be out in a minute." }
            jeu: { contexte: "Calling through the bathroom door, still in the shower.", emotion: "calm, slightly muffled" }
        sens: "Je sors dans une minute."
        motAMot: "je serai dehors dans une minute"
        usage: >-
          La réponse habituelle à celui qui attend. <en>Be out</en>, c’est « être sorti ». Le
          <en>minute</en> est rarement une vraie minute.
        gabarit: "I'll be out in [durée]."
        declinaisons:
          - { id: c01.s02.A5.d1, texte: { uk: "I'll be out in two minutes.", us: "I'll be out in two minutes." }, sens: "Je sors dans deux minutes." }
          - { id: c01.s02.A5.d2, texte: { uk: "I'll be out in a sec.", us: "I'll be out in a sec." }, sens: "Je sors dans une seconde." }
          - { id: c01.s02.A5.d3, texte: { uk: "I'm just getting out.", us: "I'm just getting out." }, sens: "Je sors, là." }
          - { id: c01.s02.A5.d4, texte: { uk: "Give me five minutes.", us: "Give me five minutes." }, sens: "Laisse-moi cinq minutes." }
          - { id: c01.s02.A5.d5, texte: { uk: "I'll be right out.", us: "I'll be right out." }, sens: "Je sors tout de suite." }
        renvois: []
  - lettre: B
    titre: La douche
    expressions:
      - id: c01.s02.B1
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [annoncer]
        enonces:
          - id: c01.s02.B1.e1
            region: commun
            texte: { uk: "I'm jumping in the shower.", us: "I'm jumping in the shower." }
            jeu: { contexte: "Telling your partner you're going to shower, on your way to the bathroom.", emotion: "breezy, quick" }
        sens: "Je file sous la douche."
        motAMot: "je saute dans la douche"
        usage: >-
          <en>Jump in the shower</en>, c’est prendre une douche rapide, sans cérémonie. On dit
          aussi <en>hop in the shower</en>.
        declinaisons:
          - { id: c01.s02.B1.d1, texte: { uk: "I'll jump in the shower first.", us: "I'll jump in the shower first." }, sens: "Je passe sous la douche d’abord." }
          - { id: c01.s02.B1.d2, texte: { uk: "Can I jump in the shower?", us: "Can I jump in the shower?" }, sens: "Je peux prendre une douche vite fait ?" }
          - { id: c01.s02.B1.d3, texte: { uk: "She's just jumped in the shower.", us: "She's just jumped in the shower." }, sens: "Elle vient de filer sous la douche." }
          - { id: c01.s02.B1.d4, texte: { uk: "I'm hopping in the shower.", us: "I'm hopping in the shower." }, sens: "Je saute sous la douche." }
          - { id: c01.s02.B1.d5, texte: { uk: "Jump in the shower, quick!", us: "Jump in the shower, quick!" }, sens: "File sous la douche, vite !" }
        renvois: []
      - id: c01.s02.B2
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [se-plaindre]
        enonces:
          - id: c01.s02.B2.e1
            region: commun
            texte: { uk: "There's no hot water!", us: "There's no hot water!" }
            jeu: { contexte: "Shouting from the shower as the water suddenly turns cold.", emotion: "shocked, indignant" }
        sens: "Il n’y a plus d’eau chaude !"
        usage: >-
          Le drame du matin. <en>No hot water</en> se dit quand le ballon est vide. Le
          reproche suit souvent : <en>Who used all the hot water?</en>
        declinaisons:
          - { id: c01.s02.B2.d1, texte: { uk: "Who used all the hot water?", us: "Who used all the hot water?" }, sens: "Qui a pris toute l’eau chaude ?" }
          - { id: c01.s02.B2.d2, texte: { uk: "The hot water's run out.", us: "The hot water's run out." }, sens: "L’eau chaude est épuisée." }
          - { id: c01.s02.B2.d3, texte: { uk: "Is there any hot water left?", us: "Is there any hot water left?" }, sens: "Il reste de l’eau chaude ?" }
          - { id: c01.s02.B2.d4, texte: { uk: "The boiler's broken again.", us: "The water heater's broken again." }, sens: "La chaudière est encore en panne." }
          - { id: c01.s02.B2.d5, texte: { uk: "Leave me some hot water!", us: "Leave me some hot water!" }, sens: "Laisse-moi de l’eau chaude !" }
        renvois: []
      - id: c01.s02.B3
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [reagir]
        enonces:
          - id: c01.s02.B3.e1
            region: commun
            texte: { uk: "The water's freezing!", us: "The water's freezing!" }
            jeu: { contexte: "Gasping as cold water hits you in the shower.", emotion: "gasping, shocked" }
        sens: "L’eau est glacée !"
        usage: >-
          <en>Freezing</en> est bien plus fort que <en>cold</en> : « glacial ». On l’emploie
          aussi pour le temps : <en>It’s freezing outside.</en>
        gabarit: "[chose] is freezing!"
        declinaisons:
          - { id: c01.s02.B3.d1, texte: { uk: "It's freezing in here!", us: "It's freezing in here!" }, sens: "On gèle, ici !" }
          - { id: c01.s02.B3.d2, texte: { uk: "My hands are freezing.", us: "My hands are freezing." }, sens: "J’ai les mains gelées." }
          - { id: c01.s02.B3.d3, texte: { uk: "It's freezing outside.", us: "It's freezing outside." }, sens: "Il fait un froid de canard dehors." }
          - { id: c01.s02.B3.d4, texte: { uk: "The water's boiling!", us: "The water's boiling!" }, sens: "L’eau est brûlante !" }
          - { id: c01.s02.B3.d5, texte: { uk: "It's a bit chilly.", us: "It's a bit chilly." }, sens: "Il fait un peu frais." }
        renvois: []
      - id: c01.s02.B4
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [annoncer]
        enonces:
          - id: c01.s02.B4.e1
            region: commun
            texte: { uk: "I'll have a quick shower.", us: "I'll take a quick shower." }
            jeu: { contexte: "Planning your morning out loud while making the bed.", emotion: "practical, matter-of-fact" }
        sens: "Je prends une douche rapide."
        motAMot: "j’aurai une douche rapide"
        usage: >-
          Londres dit <en>have a shower</en>, l’Amérique <en>take a shower</en>. Les deux se
          comprennent partout ; choisissez celui de votre accent et tenez-le.
        gabarit: "I'll have a [quick shower]."
        declinaisons:
          - { id: c01.s02.B4.d1, texte: { uk: "I had a shower last night.", us: "I took a shower last night." }, sens: "J’ai pris une douche hier soir." }
          - { id: c01.s02.B4.d2, texte: { uk: "Do I have time for a shower?", us: "Do I have time for a shower?" }, sens: "J’ai le temps de prendre une douche ?" }
          - { id: c01.s02.B4.d3, texte: { uk: "I'll have a bath tonight.", us: "I'll take a bath tonight." }, sens: "Je prendrai un bain ce soir." }
          - { id: c01.s02.B4.d4, texte: { uk: "Have a shower, you'll feel better.", us: "Take a shower, you'll feel better." }, sens: "Prends une douche, ça ira mieux." }
          - { id: c01.s02.B4.d5, texte: { uk: "I never have baths.", us: "I never take baths." }, sens: "Je ne prends jamais de bain." }
        renvois: []
      - id: c01.s02.B5
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [demander]
        enonces:
          - id: c01.s02.B5.e1
            region: commun
            texte: { uk: "Turn the shower off.", us: "Turn the shower off." }
            jeu: { contexte: "Reminding a child who has left the shower running.", emotion: "firm, reminding" }
        sens: "Ferme la douche."
        usage: >-
          <en>Turn on</en>, <en>turn off</en> : allumer, éteindre, ouvrir, fermer. Ils servent
          pour l’eau, la lumière, la radio. Avec un pronom : <en>turn it off</en>.
        gabarit: "Turn the [appareil] off."
        declinaisons:
          - { id: c01.s02.B5.d1, texte: { uk: "Turn the tap off.", us: "Turn the faucet off." }, sens: "Ferme le robinet." }
          - { id: c01.s02.B5.d2, texte: { uk: "Can you turn the light on?", us: "Can you turn the light on?" }, sens: "Tu peux allumer la lumière ?" }
          - { id: c01.s02.B5.d3, texte: { uk: "Turn it off, please.", us: "Turn it off, please." }, sens: "Éteins-le, s’il te plaît." }
          - { id: c01.s02.B5.d4, texte: { uk: "You left the shower on!", us: "You left the shower on!" }, sens: "Tu as laissé la douche ouverte !" }
          - { id: c01.s02.B5.d5, texte: { uk: "Don't forget to turn the fan off.", us: "Don't forget to turn the fan off." }, sens: "N’oublie pas d’éteindre la ventilation." }
        renvois: []
  - lettre: C
    titre: Les dents
    expressions:
      - id: c01.s02.C1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [verifier]
        enonces:
          - id: c01.s02.C1.e1
            region: commun
            texte: { uk: "Have you brushed your teeth?", us: "Have you brushed your teeth?" }
            jeu: { contexte: "A parent checking on a child before school.", emotion: "checking, parental" }
        sens: "Tu t’es brossé les dents ?"
        usage: >-
          On se brosse <en>your teeth</en>, avec le possessif : jamais <en>the teeth</en>.
          Même chose pour <en>wash your face</en>, <en>brush your hair</en>.
        gabarit: "Have you brushed your [partie du corps]?"
        declinaisons:
          - { id: c01.s02.C1.d1, texte: { uk: "Go and brush your teeth.", us: "Go brush your teeth." }, sens: "Va te brosser les dents." }
          - { id: c01.s02.C1.d2, texte: { uk: "I've already brushed my teeth.", us: "I've already brushed my teeth." }, sens: "Je me suis déjà brossé les dents." }
          - { id: c01.s02.C1.d3, texte: { uk: "Brush your teeth properly.", us: "Brush your teeth properly." }, sens: "Brosse-toi bien les dents." }
          - { id: c01.s02.C1.d4, texte: { uk: "Did you brush your teeth?", us: "Did you brush your teeth?" }, sens: "Tu t’es brossé les dents ?" }
          - { id: c01.s02.C1.d5, texte: { uk: "Brush for two minutes.", us: "Brush for two minutes." }, sens: "Brosse pendant deux minutes." }
        renvois: []
      - id: c01.s02.C2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [constater]
        enonces:
          - id: c01.s02.C2.e1
            region: commun
