  - lettre: J
    titre: Prêt à sortir
    expressions:
      - id: c01.s02.J1
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison, famille]
        fonctions: [ceder]
        enonces:
          - id: c01.s02.J1.e1
            region: commun
            texte: { uk: "It's all yours.", us: "It's all yours." }
            jeu: { contexte: "Coming out of the bathroom and holding the door for the next person.", emotion: "cheerful, relieved" }
        sens: "Elle est à toi."
        usage: >-
          La phrase pour céder la place : la salle de bain, l’ordinateur, la chaise.
          <en>All</en> la rend généreuse.
        declinaisons:
          - { id: c01.s02.J1.d1, texte: { uk: "The bathroom's free.", us: "The bathroom's free." }, sens: "La salle de bain est libre." }
          - { id: c01.s02.J1.d2, texte: { uk: "It's all yours now.", us: "It's all yours now." }, sens: "Elle est à toi maintenant." }
          - { id: c01.s02.J1.d3, texte: { uk: "I'm done, you can go in.", us: "I'm done, you can go in." }, sens: "J’ai fini, tu peux y aller." }
          - { id: c01.s02.J1.d4, texte: { uk: "Your turn.", us: "Your turn." }, sens: "À toi." }
          - { id: c01.s02.J1.d5, texte: { uk: "Sorry I took so long.", us: "Sorry I took so long." }, sens: "Désolé d’avoir été si long." }
        renvois: []
      - id: c01.s02.J2
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [annoncer]
        enonces:
          - id: c01.s02.J2.e1
            region: commun
            texte: { uk: "I'm done.", us: "I'm done." }
            jeu: { contexte: "Stepping out of the bathroom, towel on your shoulder.", emotion: "satisfied" }
        sens: "J’ai fini."
        usage: >-
          <en>I’m done</en> (j’ai terminé) se dit partout. Londres dit aussi <en>I’ve
          finished</en>. Attention, <en>I’m done!</en> sur un ton excédé veut dire « j’en ai
          assez ».
        declinaisons:
          - { id: c01.s02.J2.d1, texte: { uk: "I've finished.", us: "I've finished." }, sens: "J’ai terminé." }
          - { id: c01.s02.J2.d2, texte: { uk: "Are you done?", us: "Are you done?" }, sens: "Tu as fini ?" }
          - { id: c01.s02.J2.d3, texte: { uk: "I'm nearly done.", us: "I'm nearly done." }, sens: "J’ai presque fini." }
          - { id: c01.s02.J2.d4, texte: { uk: "I'm done with this!", us: "I'm done with this!" }, sens: "J’en ai assez !" }
          - { id: c01.s02.J2.d5, texte: { uk: "Done!", us: "Done!" }, sens: "Fini !" }
        renvois: []
      - id: c01.s02.J3
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [demander]
        enonces:
          - id: c01.s02.J3.e1
            region: commun
            texte: { uk: "How do I look?", us: "How do I look?" }
            jeu: { contexte: "Turning around in front of a partner, ready to leave.", emotion: "hopeful, a little nervous" }
        sens: "J’ai l’air de quoi ?"
        usage: >-
          La question qui attend un compliment. Réponses habituelles : <en>You look
          great</en>, <en>You look lovely</en> (Londres), <en>You look nice</en>.
        declinaisons:
          - { id: c01.s02.J3.d1, texte: { uk: "You look lovely.", us: "You look beautiful." }, sens: "Tu es ravissante." }
          - { id: c01.s02.J3.d2, texte: { uk: "Do I look okay?", us: "Do I look okay?" }, sens: "Ça va, j’ai l’air correct ?" }
          - { id: c01.s02.J3.d3, texte: { uk: "You look really nice.", us: "You look really nice." }, sens: "Tu es très bien." }
          - { id: c01.s02.J3.d4, texte: { uk: "Is this too much?", us: "Is this too much?" }, sens: "C’est trop ?" }
          - { id: c01.s02.J3.d5, texte: { uk: "You look like a million dollars.", us: "You look like a million dollars." }, sens: "Tu es superbe." }
        renvois: []
      - id: c01.s02.J4
        ton: courant
        niveau: fondations
        frequence: 4
        situations: [matin, maison]
        fonctions: [complimenter]
        enonces:
          - id: c01.s02.J4.e1
            region: commun
            texte: { uk: "You smell nice.", us: "You smell nice." }
            jeu: { contexte: "Leaning in to kiss a partner who has just showered.", emotion: "warm, affectionate" }
        sens: "Tu sens bon."
        usage: >-
          <en>Smell</en> + adjectif, sans <en>good</en> obligatoire : <en>You smell nice</en>,
          <en>It smells awful</en>. Le contraire se dit avec tact.
        gabarit: "You smell [adjectif]."
        declinaisons:
          - { id: c01.s02.J4.d1, texte: { uk: "What's that smell?", us: "What's that smell?" }, sens: "Qu’est-ce que ça sent ?" }
          - { id: c01.s02.J4.d2, texte: { uk: "It smells lovely in here.", us: "It smells great in here." }, sens: "Ça sent bon ici." }
          - { id: c01.s02.J4.d3, texte: { uk: "Is that a new perfume?", us: "Is that a new perfume?" }, sens: "C’est un nouveau parfum ?" }
          - { id: c01.s02.J4.d4, texte: { uk: "It smells like coconut.", us: "It smells like coconut." }, sens: "Ça sent la noix de coco." }
          - { id: c01.s02.J4.d5, texte: { uk: "Something smells funny.", us: "Something smells funny." }, sens: "Ça sent bizarre." }
        renvois: []
      - id: c01.s02.J5
        ton: courant
        niveau: fondations
        frequence: 5
        situations: [matin, maison]
        fonctions: [annoncer]
        enonces:
          - id: c01.s02.J5.e1
            region: commun
            texte: { uk: "Right, I'm ready.", us: "Okay, I'm ready." }
            jeu: { contexte: "Grabbing your bag, finally out of the bathroom.", emotion: "brisk, decisive" }
        sens: "Bon, je suis prête."
        usage: >-
          <en>Right</en>, à Londres, ouvre l’action : « bon, allez ». L’Amérique dit
          <en>Okay</en>. C’est le tic de Sarah, dans ses deux versions.
        declinaisons:
          - { id: c01.s02.J5.d1, texte: { uk: "Right, let's go.", us: "Okay, let's go." }, sens: "Bon, on y va." }
          - { id: c01.s02.J5.d2, texte: { uk: "Are you ready?", us: "Are you ready?" }, sens: "Tu es prêt ?" }
          - { id: c01.s02.J5.d3, texte: { uk: "I'm almost ready.", us: "I'm almost ready." }, sens: "Je suis presque prête." }
          - { id: c01.s02.J5.d4, texte: { uk: "Ready when you are.", us: "Ready when you are." }, sens: "Je suis prête quand tu veux." }
          - { id: c01.s02.J5.d5, texte: { uk: "Finally!", us: "Finally!" }, sens: "Enfin !" }
        renvois: []
essentiel:
  incontournables: [c01.s02.A1, c01.s02.A2, c01.s02.A3, c01.s02.A5, c01.s02.B4, c01.s02.C1, c01.s02.C2, c01.s02.E5, c01.s02.J1, c01.s02.J3]
  fauxPas:
    - fautif: "I take a shower. (à Londres)"
      naturel: "I'm having a shower."
      pourquoi: "À Londres, on <en>has</en> une douche ; l’Amérique la <en>takes</en>. Et pour l’action en cours, le présent progressif : <en>I’m having a shower</en>."
    - fautif: "I brush the teeth."
      naturel: "I brush my teeth."
      pourquoi: "Le possessif est obligatoire avec les parties du corps : <en>my teeth</en>, <en>your hair</en>, <en>his face</en>."
    - fautif: "I wash me."
      naturel: "I'm having a wash."
      pourquoi: "Le réfléchi s’emploie peu : on dit <en>I’m washing</en> ou <en>I’m having a wash</en>. <en>Myself</en> se garde pour l’accident : <en>I cut myself</en>."
    - fautif: "My hairs are wet."
      naturel: "My hair is wet."
      pourquoi: "La chevelure est indénombrable : <en>hair</en>, au singulier. <en>Hairs</en> désigne des cheveux isolés, dans le lavabo."
    - fautif: "Where are the toilets? (chez quelqu’un)"
      naturel: "Where's the loo?"
      pourquoi: "Chez des amis, on demande <en>the loo</en> (Londres) ou <en>the bathroom</en> (Amérique). <en>Toilets</en> au pluriel, c’est le lieu public."
    - fautif: "I cut my hair. (chez le coiffeur)"
      naturel: "I had my hair cut."
      pourquoi: "Si quelqu’un d’autre l’a fait, on dit <en>have something done</en> : <en>I had my hair cut</en>, <en>I got a haircut</en>."
    - fautif: "The door doesn't want to lock."
      naturel: "The door won't lock."
      pourquoi: "Pour un objet qui refuse de marcher, <en>won’t</en> suffit ; <en>want</en> est réservé aux êtres vivants."
    - fautif: "I'm finish."
      naturel: "I'm done."
      pourquoi: "On est <en>done</en> ou on <en>has finished</en> ; <en>finish</en> seul est un verbe, pas un état."
sceneVivante:
  titre: Une seule salle de bain
  repliques:
    - { id: c01.s02.sv.l01, personnage: sarah, texte: { uk: "Who's in the bathroom?", us: "Who's in the bathroom?" }, sens: "Qui est dans la salle de bain ?", emotion: "knocking, impatient" }
    - { id: c01.s02.sv.l02, personnage: mia, texte: { uk: "Me! I'm brushing my teeth.", us: "Me! I'm brushing my teeth." }, sens: "Moi ! Je me brosse les dents.", emotion: "muffled, mouth full of toothpaste" }
    - { id: c01.s02.sv.l03, personnage: sarah, texte: { uk: "You've been in there for twenty minutes.", us: "You've been in there for twenty minutes." }, sens: "Ça fait vingt minutes que tu es là-dedans.", emotion: "sceptical" }
    - { id: c01.s02.sv.l04, personnage: mia, texte: { uk: "I'm doing it properly, like you said!", us: "I'm doing it properly, like you said!" }, sens: "Je les brosse bien, comme tu m’as dit !", emotion: "virtuous, cheeky" }
    - { id: c01.s02.sv.l05, personnage: kofi, texte: { uk: "Is there any hot water left?", us: "Is there any hot water left?" }, sens: "Il reste de l’eau chaude ?", emotion: "hopeful, from the hallway" }
    - { id: c01.s02.sv.l06, personnage: sarah, texte: { uk: "Not if Mia's had a bath.", us: "Not if Mia took a bath." }, sens: "Pas si Mia a pris un bain.", emotion: "dry" }
    - { id: c01.s02.sv.l07, personnage: mia, texte: { uk: "I only had a shower!", us: "I only took a shower!" }, sens: "J’ai juste pris une douche !", emotion: "indignant" }
    - { id: c01.s02.sv.l08, personnage: kofi, texte: { uk: "Hurry up in there, sweetheart.", us: "Hurry up in there, sweetheart." }, sens: "Dépêche-toi, ma chérie.", emotion: "gentle but firm" }
    - { id: c01.s02.sv.l09, personnage: mia, texte: { uk: "I'll be out in a minute!", us: "I'll be out in a minute!" }, sens: "Je sors dans une minute !", emotion: "breezy" }
    - { id: c01.s02.sv.l10, personnage: sarah, texte: { uk: "Honestly… I need the loo.", us: "Honestly… I need the bathroom." }, sens: "Franchement… il faut que j’aille aux toilettes.", emotion: "exasperated, crossing her legs" }
    - { id: c01.s02.sv.l11, personnage: mia, texte: { uk: "It's all yours!", us: "It's all yours!" }, sens: "Elle est à toi !", emotion: "cheerful, opening the door" }
    - { id: c01.s02.sv.l12, personnage: sarah, texte: { uk: "Finally. Who left their towel on the floor?", us: "Finally. Who left their towel on the floor?" }, sens: "Enfin. Qui a laissé sa serviette par terre ?", emotion: "relieved, then accusing" }
    - { id: c01.s02.sv.l13, personnage: mia, texte: { uk: "Not me!", us: "Not me!" }, sens: "C’est pas moi !", emotion: "running away, giggling" }
    - { id: c01.s02.sv.l14, personnage: kofi, texte: { uk: "Right, I'm jumping in the shower.", us: "Okay, I'm jumping in the shower." }, sens: "Bon, je file sous la douche.", emotion: "decisive" }
    - { id: c01.s02.sv.l15, personnage: sarah, texte: { uk: "There's no hot water, Kofi.", us: "There's no hot water, Kofi." }, sens: "Il n’y a plus d’eau chaude, Kofi.", emotion: "deadpan" }
rituel:
  - "Ce matin, devant le miroir, dites <en>I look awful</en>, puis répondez-vous <en>No, you look great</en>."
  - "En sortant de la salle de bain, dites <en>It’s all yours</en> à la personne suivante, même en pensée."
  - "Quand un produit est fini, dites-le en anglais : <en>We’re out of toothpaste</en>."
