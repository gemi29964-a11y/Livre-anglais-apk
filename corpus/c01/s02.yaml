          - { id: c01.s02.C3.d1, texte: { uk: "Can I borrow your hairbrush?", us: "Can I borrow your hairbrush?" }, sens: "Je peux emprunter ta brosse ?" }
          - { id: c01.s02.C3.d2, texte: { uk: "Can you lend me a towel?", us: "Can you lend me a towel?" }, sens: "Tu peux me prêter une serviette ?" }
          - { id: c01.s02.C3.d3, texte: { uk: "Don't borrow my razor!", us: "Don't borrow my razor!" }, sens: "N’emprunte pas mon rasoir !" }
          - { id: c01.s02.C3.d4, texte: { uk: "You can borrow mine.", us: "You can borrow mine." }, sens: "Tu peux prendre le mien." }
          - { id: c01.s02.C3.d5, texte: { uk: "I borrowed your shampoo.", us: "I borrowed your shampoo." }, sens: "J’ai pris ton shampoing." }
        renvois: []
      - id: c01.s02.C4
        ton: courant
        niveau: fondations
        frequence: 3
        situations: [matin, maison, famille]
        fonctions: [expliquer]
        enonces:
          - id: c01.s02.C4.e1
            region: commun
            texte: { uk: "Rinse your mouth out.", us: "Rinse your mouth out." }
            jeu: { contexte: "A parent guiding a young child at the sink.", emotion: "patient, instructive" }
        sens: "Rince-toi la bouche."
