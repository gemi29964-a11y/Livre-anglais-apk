# Script d'essai des voix (7.4, « Le choix des timbres ») — identique pour tous les candidats d'un même accent.
# 40 lignes de l'ouvrage, chacune dite en posé puis en spontané. Couverture exigée :
#   formes faibles, t battu (US) ou coup de glotte (UK), intonations de question (oui/non, ouverte, écho, étiquette),
#   quatre tons (courant, complice, cru, soutenu) et une réplique de scène vivante.
# Les lignes 1 à 32 viennent de la scène étalon c01.s01 ; les lignes 33 à 40 viennent des chapitres à venir
# (tons cru et soutenu, que la scène étalon ne contient pas) et entreront au corpus avec leur chapitre (D-042).
# Le champ « trait » dit ce que la ligne éprouve chez la voix.
lignes:
  - { id: e01, source: c01.s01.A1.e1, ton: courant, trait: formes faibles, uk: "My alarm's going off.", us: "My alarm's going off.", contexte: "Half-asleep, the alarm is ringing on the bedside table.", emotion: "groggy, matter-of-fact" }
  - { id: e02, source: c01.s01.A2.e2, ton: courant, trait: formes faibles, uk: "Just five more minutes.", us: "Just five more minutes.", contexte: "From under the duvet, eyes still closed.", emotion: "sleepy, pleading" }
  - { id: e03, source: c01.s01.A3.e1, ton: courant, trait: t final, uk: "I hit snooze.", us: "I hit snooze.", contexte: "Admitting why you are late.", emotion: "sheepish" }
  - { id: e04, source: c01.s01.A5.d2, ton: courant, trait: question oui/non, uk: "Is it seven already?", us: "Is it seven already?", contexte: "Squinting at the clock in disbelief.", emotion: "dismayed" }
  - { id: e05, source: c01.s01.A5.d5, ton: courant, trait: phrase longue, uk: "It feels like I only just went to bed.", us: "It feels like I only just went to bed.", contexte: "Sitting on the edge of the bed, rubbing your eyes.", emotion: "weary, rueful" }
  - { id: e06, source: c01.s01.B1.d5, ton: courant, trait: question, uk: "Sorry, did I wake you?", us: "Sorry, did I wake you?", contexte: "You knocked something over in the dark bedroom.", emotion: "apologetic, soft" }
  - { id: e07, source: c01.s01.B2.d1, ton: complice, trait: mélodie, uk: "Rise and shine, sleepyhead!", us: "Rise and shine, sleepyhead!", contexte: "Opening the curtains on a partner who is still asleep.", emotion: "teasing, cheerful" }
  - { id: e08, source: c01.s01.B3.e2, ton: courant, trait: coup de glotte ou t battu, uk: "It's time to get up.", us: "It's time to get up.", contexte: "Gently shaking a sleeping child's shoulder.", emotion: "kind, firm" }
  - { id: e09, source: c01.s01.B4.e1, ton: courant, trait: question oui/non, uk: "Are you awake?", us: "Are you awake?", contexte: "Whispering in the dark.", emotion: "hesitant, quiet" }
  - { id: e10, source: c01.s01.B5.d2, ton: courant, trait: réduction going to, uk: "We're going to miss the bus.", us: "We're going to miss the bus.", spontane_uk: "We're gonna miss the bus.", spontane_us: "We're gonna miss the bus.", contexte: "Looking at the time while the children dawdle.", emotion: "anxious, urgent" }
  - { id: e11, source: c01.s01.C2.d1, ton: courant, trait: formes faibles, uk: "Sorry, I'm half asleep.", us: "Sorry, I'm half asleep.", contexte: "Someone asked you a question you did not hear.", emotion: "apologetic, foggy" }
  - { id: e12, source: c01.s01.C3.d4, ton: courant, trait: question ouverte, uk: "Do you know what time it is?", us: "Do you know what time it is?", contexte: "Woken by a phone call in the middle of the night.", emotion: "annoyed, incredulous" }
  - { id: e13, source: c01.s01.C4.e1, ton: courant, trait: t final, uk: "I can't keep my eyes open.", us: "I can't keep my eyes open.", contexte: "Late evening on the sofa.", emotion: "drowsy" }
  - { id: e14, source: c01.s01.C5.e1, ton: courant, trait: réduction give me, uk: "Give me a minute.", us: "Give me a minute.", spontane_uk: "Gimme a minute.", spontane_us: "Gimme a minute.", contexte: "Someone is rushing you while you put your shoes on.", emotion: "patient, slightly tense" }
  - { id: e15, source: c01.s01.D2.e2, ton: courant, trait: mélodie, uk: "I slept like a baby.", us: "I slept like a baby.", contexte: "Stretching happily after a great night.", emotion: "content, smiling" }
  - { id: e16, source: c01.s01.D3.e1, ton: courant, trait: négation, uk: "I didn't sleep a wink.", us: "I didn't sleep a wink.", contexte: "Coming into the kitchen with dark circles under your eyes.", emotion: "grumpy" }
  - { id: e17, source: c01.s01.D4.e1, ton: courant, trait: liaisons, uk: "I tossed and turned all night.", us: "I tossed and turned all night.", contexte: "Explaining to a colleague why you look tired.", emotion: "tired, matter-of-fact" }
  - { id: e18, source: c01.s01.D5.d3, ton: courant, trait: phrase longue, uk: "I woke up at three and couldn't get back to sleep.", us: "I woke up at three and couldn't get back to sleep.", contexte: "Telling a friend about a bad night.", emotion: "frustrated" }
  - { id: e19, source: c01.s01.E1.e1, ton: complice, trait: mélodie, uk: "I had the weirdest dream.", us: "I had the weirdest dream.", contexte: "Sitting up in bed, still half in the dream.", emotion: "amused, puzzled" }
  - { id: e20, source: c01.s01.E5.d5, ton: courant, trait: question ouverte, uk: "What were we talking about?", us: "What were we talking about?", contexte: "You drifted off in the middle of a conversation.", emotion: "confused, sheepish" }
  - { id: e21, source: c01.s01.F1.d2, ton: complice, trait: mélodie, uk: "You snore like a train.", us: "You snore like a train.", contexte: "Teasing your partner over breakfast.", emotion: "playful" }
  - { id: e22, source: c01.s01.F2.d1, ton: courant, trait: graphie divergente, uk: "The neighbours kept me up.", us: "The neighbors kept me up.", contexte: "Complaining about the party next door.", emotion: "irritated" }
  - { id: e23, source: c01.s01.G1.e2, ton: courant, trait: régional, uk: "I'm shattered.", us: "I'm beat.", contexte: "Dropping onto the sofa at the end of the day.", emotion: "exhausted" }
  - { id: e24, source: c01.s01.G3.e1, ton: courant, trait: négation, uk: "I'm not a morning person.", us: "I'm not a morning person.", contexte: "Apologising for being grumpy before coffee.", emotion: "self-deprecating, wry" }
  - { id: e25, source: c01.s01.G4.e1, ton: complice, trait: mélodie, uk: "I could sleep for a week.", us: "I could sleep for a week.", contexte: "After a very long week.", emotion: "longing, exaggerated" }
  - { id: e26, source: c01.s01.H3.d2, ton: courant, trait: t battu ou coup de glotte, uk: "We're running a bit late.", us: "We're running a bit late.", contexte: "Texting by voice while walking fast.", emotion: "hurried, apologetic" }
  - { id: e27, source: c01.s01.H4.d2, ton: courant, trait: question ouverte, uk: "Why didn't anyone wake me?", us: "Why didn't anyone wake me?", contexte: "Rushing into the kitchen, late.", emotion: "panicked, accusing" }
  - { id: e28, source: c01.s01.I2.d1, ton: courant, trait: répétition, uk: "Okay, okay, I'm up.", us: "Okay, okay, I'm up.", contexte: "Someone keeps calling you from downstairs.", emotion: "grudging" }
  - { id: e29, source: c01.s01.I3.d3, ton: courant, trait: réduction want to, uk: "I really don't want to get up today.", us: "I really don't want to get up today.", spontane_uk: "I really don't wanna get up today.", spontane_us: "I really don't wanna get up today.", contexte: "Monday morning, rain against the window.", emotion: "reluctant, whiny" }
  - { id: e30, source: c01.s01.I5.d3, ton: complice, trait: question rhétorique, uk: "Who rattled your cage?", us: "Who rattled your cage?", contexte: "Your housemate snapped at you for no reason.", emotion: "teasing, mock-offended" }
  - { id: e31, source: c01.s01.L1.d2, ton: courant, trait: question d'offre, uk: "Shall I put the kettle on?", us: "Want me to make some coffee?", contexte: "Seeing a tired face come into the kitchen.", emotion: "warm, caring" }
  - { id: e32, source: c01.s01.sv.l08, ton: courant, trait: réplique de scène vivante, uk: "I didn't sleep a wink. You were snoring like a chainsaw.", us: "I didn't sleep a wink. You were snoring like a chainsaw.", contexte: "Scene, kitchen at 7 a.m.: answering your partner who asked how you slept.", emotion: "grumpy, accusing" }
  - { id: e33, source: c22.cru, ton: cru, trait: juron léger, uk: "Bloody hell, it's freezing!", us: "Damn, it's freezing!", contexte: "Stepping out of a warm house into icy wind.", emotion: "shocked, exasperated" }
  - { id: e34, source: c22.cru, ton: cru, trait: argot, uk: "Shut up, you're taking the mick.", us: "Shut up, you're messing with me.", contexte: "A friend just told you something unbelievable.", emotion: "laughing, disbelieving" }
  - { id: e35, source: c22.cru, ton: cru, trait: énervement, uk: "Oh, for God's sake, not again!", us: "Oh, for God's sake, not again!", contexte: "The printer has jammed for the third time.", emotion: "fed up, loud" }
  - { id: e36, source: c13.soutenu, ton: soutenu, trait: politesse, uk: "I'm terribly sorry to have kept you waiting.", us: "I'm so sorry to have kept you waiting.", contexte: "Greeting a client in a hotel lobby.", emotion: "polite, composed" }
  - { id: e37, source: c13.soutenu, ton: soutenu, trait: question polie, uk: "Would you mind closing the window, please?", us: "Would you mind closing the window, please?", contexte: "In a meeting room, to a colleague you do not know well.", emotion: "courteous" }
  - { id: e38, source: c13.soutenu, ton: soutenu, trait: phrase longue, uk: "I'd be grateful if you could send me the details by Friday.", us: "I'd appreciate it if you could send me the details by Friday.", contexte: "Ending a business phone call.", emotion: "professional, warm" }
  - { id: e39, source: c13.soutenu, ton: soutenu, trait: question étiquette, uk: "You haven't met my colleague, have you?", us: "You haven't met my colleague, have you?", contexte: "Introducing two people at a reception.", emotion: "gracious" }
  - { id: e40, source: c13.soutenu, ton: soutenu, trait: nombres, uk: "The meeting has been moved to half past two.", us: "The meeting has been moved to two-thirty.", contexte: "Announcing a change to a team.", emotion: "clear, calm" }
